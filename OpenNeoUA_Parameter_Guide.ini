begin_fx                            ; Additional visual Chain FX executed once when detonation starts.
  trigger = detonate                                                            ; SuperItems currently support detonate as the Chain FX trigger.
  mode = visual                                                                 ; SuperItems currently support visual as the Chain FX mode.
  random_rotation = 0                                                           ; 1 assigns a random X/Y/Z orientation once at spawn, independently per instance; 0, omitted or invalid = normal orientation. Spawn position and launch direction are unchanged.
  offset_xyz = 0_0_0                                                            ; X_Y_Z offset from the bomb's native center. Single value = fixed; min~max = random offset rolled at every activation. Format: x_y_z; each axis takes a single value or min~max.
  spin_xyz = 0_0_10                                                             ; X_Y_Z spin intensity of the Chain FX VP/BASE/3DS visuals: 0-10, decimals allowed; 0 = no spin. Applies to every model in the block. Format: x_y_z.
  start_size = 0                                                                ; Initial Chain FX scale.
  mid_size = 10                                                                 ; Optional intermediate scale. If absent/invalid, direct start_size -> end_size interpolation is used.
  end_size = 20                                                                 ; Final Chain FX scale.
  duration = 6000                                                               ; Total Chain FX duration in milliseconds. Must be positive.
  fade_inout = 500_1000                                                         ; Visual fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate.
  vp_model = 254                                                                ; Legacy VP visual for this Chain FX element. The line may be repeated to build a sequence.
  base_model = Data/Models/Base/FX/CHAIN_FX.BASE                                ; Optional BASE family for the same element. Place it after vp_model to keep that VP as fallback.
  3ds_model = Data/Models/3ds/FX/chain_fx.3ds                                   ; Optional 3DS model for the same element; takes priority over base_model and vp_model.
  tint = 255_255_255_255                                                        ; RGBA tint for all models in the visual block, regardless of position. The last value wins; omitted tint preserves original colours.
end

--------------------Buildings:

; Building decoration FX can be periodic or persistent. Both modes use the same
; VP/BASE/3DS visual family, but their lifetime rules differ:
; - periodic: spawn one or more decorations at configured intervals;
; - persistent: keep the decoration active while the building remains active
;   and alive.

decoration_fx_mode = periodic                                                   ; Periodic decoration mode: decorations appear intermittently using the timing/count parameters below.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of the active decoration visual. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Under additive blending, fading also attenuates visual intensity correctly.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.
decoration_fx_duration = 1000                                                   ; Total duration in milliseconds of each periodic decoration instance.
decoration_fx_interval = 500_1500                                               ; Random interval in milliseconds between decoration spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                                                       ; Random number of decorations generated per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                                                   ; XYZ position randomization around the center of the building sector.
decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the center of the building sector. Format: x_y_z.

decoration_fx_mode = persistent                                                 ; Persistent decoration mode: the decoration remains active while the building remains active and alive.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of the active decoration visual. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity for the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Under additive blending, fading also attenuates visual intensity correctly.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.

decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the center of the building sector. Format: x_y_z.

; Building spawners let a map object create vehicles dynamically instead of
; requiring every unit to be placed directly in the level data.

spawn_units = 1                                                                 ; Enables this building to spawn units.
spawn_vehicle = 5                                                               ; Vehicle ID generated by this building.
spawn_count = 3                                                                 ; Number of units generated at each spawner activation.
spawn_interval = 6000                                                           ; Interval in milliseconds between spawner activations.
spawn_trigger_radius = 1800                                                     ; XZ radius within which enemy presence activates the spawner.
spawn_random_pos = 340                                                          ; XZ position randomization around the building center.
spawn_offset_xz = 37_-41                                                        ; X_Z offset applied to the center of the building spawn area. Format: x_z.
spawn_height = 650_900                                                          ; Random additional height above the real surface at which the unit is created. A single value gives a fixed height.
spawn_instant = 1                                                               ; 1 creates units instantly without the classic Genesis sequence.
spawn_max_active = 9                                                            ; Maximum number of units generated by this building that may remain active at the same time.

tint = 60_255_60_255                                                            ; RGBA tint applied to the building's main visual.

production_cost = 1400                                                          ; Displayed Genesis price for this building. Overrides the vanilla Energy-derived price without changing hit points. 0 or absent = vanilla behavior (Energy / 100).
building_description = Defense outpost                                          ; Optional building description shown in the Database. If absent, the Description row is not shown.
type_icon = V                                                                   ; Building icon (a .FON glyph key). A Unicode symbol is also accepted, e.g. ∆ or U+2206, linked in the .FON to the icon coordinates. Any value other than I lists the building in the Database. Prefer U+XXXX in scripts: a pasted symbol can be corrupted by the editor's text encoding, and an unreadable icon falls back to the default A icon. The replacement character U+FFFD is rejected.

--------------------Vehicles:

; OpenNeoUA adds new vehicle models/aliases and extends existing vehicle
; definitions with AI affinities, per-event speech, custom visuals, collision
; behavior, status systems and other optional capabilities.

model = cruiser                                                                 ; Airborne vehicle model with smooth up/down response and comparatively rigid left/right response.

model = module                                                                  ; Alternate alias for model = gun; behavior is the same.

model = mimic                                                                   ; Mimic vehicle type. Creates a copy of itself using another eligible unit already present on the map as the visual/template source; excludes itself, robo and gun classes. at_death_spawn_units can be combined with this definition for additional behavior.
mimic_tint = 60_255_90_255                                                      ; RGBA multiplier applied to the visual copied by the Mimic, for both VP and 3DS visuals.
mimic_energy_cost = 20000_30000                                                 ; Energy required to create the mimic. Single value = fixed cost; min_max = random cost.
snd_mimic_sample  = sounds/sulgi.wav                                            ; Mimic-specific sound used during disguise.
snd_mimic_volume  = 120                                                         ; Mimic sound volume.
snd_mimic_pitch = 4500_5500                                                     ; Mimic sound pitch. Single value = fixed; min_max = random pitch selected on each playback.

; gun_type changes the role of vehicle/building definitions using the gun
; class. This is more than a visual switch: each type selects a different
; interaction path while retaining the existing gun data structure where
; possible.

gun_type = flak                                                                 ; Vanilla flak behavior; no OpenNeoUA role change.
gun_type = mg                                                                   ; Restored cut-content behavior: the flak uses MGUN as its primary weapon. Effective range follows game.mgun_range.
gun_type = dummy                                                                ; Decorative/defensive role: does not interact and its interfaces are disabled.
gun_type = radar                                                                ; Turns toward the nearest Host Station when that station is visible on radar; otherwise retains the normal gun behavior path.
gun_type = power                                                                ; Compatible with power and power_radius. The gun does not attack but supplies energy to nearby units.

gun_levitate = 0                                                                ; gun/flak classes only: 1 prevents falling without a supporting surface. 0, absent or invalid = normal falling behavior.
disable_collision = 0                                                           ; Vehicle and Weapon: 1 disables physical contacts with units, projectiles, terrain and buildings, including radius, compound spheres and collision_shape. 0, absent or invalid = normal collisions.
; disable_collision does not disable gravity, lifetime expiry, timed explosions or area damage, and does not grant invulnerability. Map bounds remain enforced.

; AI fight affinities extend the original broad flyer/tank targeting families
; to the newer model classes. When omitted, the documented legacy affinity is
; used so older scripts continue to behave as expected.

job_fightplane    = 6                                                           ; AI fight affinity against model = plane. Absent = job_fightflyer.
job_fightglider   = 6                                                           ; AI fight affinity against model = glider. Absent = job_fightflyer.
job_fightzeppelin = 6                                                           ; AI fight affinity against model = zeppelin. Absent = job_fightflyer.
job_fightcruiser  = 6                                                           ; AI fight affinity against model = cruiser. Absent = job_fightflyer.
job_fightufo      = 6                                                           ; AI fight affinity against model = ufo. Absent = job_fightflyer.
job_fightcar      = 6                                                           ; AI fight affinity against model = car. Absent = job_fighttank.
job_fightgun      = 6                                                           ; AI fight affinity against model = gun/module. Absent = legacy AI-path behavior.

spy_ui_radius = 6000                                                            ; UFO classes only, player side: radius in which Spy Mode reveals unit interfaces. Toggle with the remappable UFO Spy Mode On/Off action (Spacebar by default) or the fixed middle-mouse shortcut. 0 or absent = disabled.
spy_ui_radius_sound = sounds/new/spy_ui.wav                                     ; UFO classes only: optional sound played every time Spy Mode is enabled or disabled. Empty/absent/unloadable = silent.
zoom_steps    = 4                                                               ; UFO classes only, player side: maximum number of 1.25x optical zoom-in steps. 0 locks zoom to 1x; absent/invalid keeps the OpenNeoUA limit.
zoom_step_sound = sounds/new/spy_zoom.wav                                       ; UFO classes only: optional one-shot played whenever an optical zoom step is actually applied. No sound is played when input is received at an already reached zoom limit. Empty/absent/unloadable = silent.

; Vehicle Chain FX can replace the old single-purpose dest_fx relationship with
; an explicit sequence. "visual" creates scalable visuals; modern "physical"
; creates an autonomous inline fragment with its own visual and physics data, so
; new content no longer needs to reserve a Vehicle ID for debris/effect objects.

begin_fx                       ; Visual vehicle Chain FX, replacing a dest_fx that points to a scale_fx.
  trigger    = destroyed o air_destroyed                                        ; Trigger: destroyed = vehicle destroyed on the ground; air_destroyed = vehicle destroyed in flight.
  mode = visual                                                                 ; Visual mode uses start_size/end_size/duration and the VP/BASE/3DS visual definitions below.
  random_rotation = 0                                                           ; 1 assigns a random X/Y/Z orientation once at spawn, independently per instance; 0, omitted or invalid = normal orientation. Spawn position and launch direction are unchanged.
  count = 2_4                                                                   ; Number of effect instances generated per activation. Single value = fixed amount; min_max = random amount rolled per activation. Maximum 32; invalid = 1. With count > 1 each instance rolls its own min_max offset. Supported only with mode = visual and mode = physical; not available in SuperItem Chain FX blocks.
  offset_xyz = -20_0_20                                                         ; Effect X_Y_Z offset. Single value = fixed; min~max = random offset rolled at every activation. Format: x_y_z; each axis takes a single value or min~max.
  spin_xyz = 0_0_10                                                             ; X_Y_Z spin intensity of the Chain FX VP/BASE/3DS visuals: 0-10, decimals allowed; 0 = no spin. Applies to every model in the block. Format: x_y_z.
  start_size = 0.1                                                              ; Initial effect size. 1 = original visual size.
  end_size   = 2                                                                ; Final effect size.
  mid_size   = 1                                                                ; Intermediate effect size.
  duration   = 1000                                                             ; Effect duration in milliseconds.
  fade_inout = 500_1000                                                         ; Visual fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate.
  vp_model   = 229                                                              ; First legacy VP visual in the sequence.
  base_model = Data/Models/Base/FX/CHAIN_FX.BASE                                ; Optional BASE family for the same element. Place after vp_model to keep that VP as fallback.
  3ds_model = Data/Models/3ds/FX/chain_fx.3ds                                   ; Optional 3DS model for the same element; takes priority over base_model and vp_model.
  tint = 80_160_255_180                                                         ; RGBA tint for all models in the visual block, regardless of position. The last value wins; omitted tint preserves original colours.
  vp_model   = 230                                                              ; Second visual in the sequence.
  vp_model   = 231                                                              ; Third visual in the sequence.
end

begin_fx                       ; Autonomous inline Physical FX; defines the fragment directly without consuming a Vehicle ID.
  trigger = destroyed o air_destroyed                                           ; Vehicle trigger: destroyed = killed on the ground; air_destroyed = killed in flight.
  mode = physical                                                               ; Enables the modern inline physical fragment path. physical_vehicle is not required.
  random_rotation = 0                                                           ; 1 assigns a random X/Y/Z orientation once at spawn, independently per instance; 0, omitted or invalid = normal orientation. Spawn position and launch direction are unchanged.
  follow_carcass = 1                                                            ; 1 = this fragment mirrors the position and rotation of the destroyed unit's falling wreck (the wreck keeps its own physics) until the wreck lands, then continues with its own physics. 0 or absent = the fragment uses its own physics. Applies to every fragment with follow_carcass = 1, including those from other blocks or with count > 1. Mainly meaningful with air_destroyed, where the wreck is still in flight.
  lifetime = 30000                                                              ; Maximum time in milliseconds that the Physical Fragment may remain in flight before it is removed. Single value = fixed lifetime; min_max = a lifetime rolled independently for each fragment. 0, absent or invalid = 30000. Ground contact still removes the fragment immediately.
  count = 1_4                                                                   ; Number of fragments created per activation. Single value = fixed; min_max = random. Runtime maximum: 32. Each fragment independently selects its own VP entry from vp_model.
  launch_xyz = -30~30_-20_-30~30                                                ; Initial local X_Y_Z velocity (format x_y_z). Each axis takes a single value (fixed) or min~max (randomized independently for each fragment). Inline fragments spawn at the event position rather than using offset_xyz.
  vp_model = 138_193                                                            ; One or more legacy moving-fragment VP IDs separated by _. Each spawned fragment randomly selects one entry; a single value preserves the previous behavior. VP remains the final fallback after 3DS/BASE.
  base_model = Data/Models/Base/FX/FRAGMENT.BASE                                ; Optional BASE family; falls back to vp_model.
  3ds_model = Data/Models/3ds/FX/fragment.3ds                                   ; Optional 3DS fragment model; takes priority over BASE and VP.
  vp_impact = 140_69                                                            ; Positional impact-VP list paired with vp_model. The selected model index always uses the impact at the same index, so 138 -> 140 and 193 -> 69. When present, the list must contain the same number of entries as vp_model; 0 disables the impact VP for that position.
  ; Entries may be repeated to weight random selection. Example: vp_model = 138_138_193 makes 138 twice as likely; vp_impact must repeat the matching impacts in the same order.
  tint = 255_255_255_255                                                        ; RGBA tint applied to the fragment visual.
  scale = 1.0                                                                   ; Uniform VP/BASE/3DS fragment scale. <= 0 or invalid = 1.0.
  mass = 150                                                                    ; Fragment mass. Must be positive.
  airconst = 40.0                                                               ; Air resistance used by fragment physics. 0 is valid.
  force = 6000                                                                  ; Additional impulse along the launch direction. 0 is valid.
  maxrot = 3.0                                                                  ; Fragment rotation intensity. 0 disables additional rotation.
  radius = 1.0                                                                  ; Physical/collision radius. Must be positive.
  impact_energy = 200                                                           ; Energy removed once from the first unit hit by this physical fragment. Respects shield and invulnerability. 0 or absent = disabled. Single-player only.
  impact_energy_radius = 0                                                      ; Additional 3D radius for energy removal on impact. 0 = direct target only; a positive value removes the same energy from nearby units. Each fragment can remove energy only once.
  snd_normal_sample = Data/Sounds/shot7.wav                                     ; Optional sound started when the fragment is created.
  snd_normal_volume = 90                                                        ; normal event sound volume.
  snd_normal_pitch = 0_500                                                      ; normal event pitch. Single value = fixed; min_max = random.
  snd_normal_radius = 0                                                         ; normal event sound radius. 0 = legacy attenuation behavior.
  snd_goingdown_sample = Data/Sounds/fall.wav                                   ; Optional sound for the goingdown phase.
  snd_goingdown_volume = 90                                                     ; goingdown event sound volume.
  snd_goingdown_pitch = 0_500                                                   ; goingdown event pitch. Single value = fixed; min_max = random.
  snd_goingdown_radius = 0                                                      ; goingdown event sound radius. 0 = legacy attenuation behavior.
  pal_goingdown_slot = 1                                                        ; Palette slot for goingdown. 0 = disabled.
  pal_goingdown_mag0 = 1                                                        ; Initial goingdown palette magnitude.
  pal_goingdown_mag1 = 0                                                        ; Final goingdown palette magnitude.
  pal_goingdown_time = 1000                                                     ; goingdown palette duration in milliseconds.
  pal_goingdown_radius = 0                                                      ; goingdown palette radius. 0 = legacy behavior.
  snd_explode_sample = Data/Sounds/impact.wav                                   ; Optional sound played when the fragment finishes/impacts.
  snd_explode_volume = 90                                                       ; explode event sound volume.
  snd_explode_pitch = 0_500                                                     ; explode event pitch. Single value = fixed; min_max = random.
  snd_explode_radius = 0                                                        ; explode event sound radius. 0 = legacy attenuation behavior.
  pal_explode_slot = 1                                                          ; Palette slot for explode. 0 = disabled.
  pal_explode_mag0 = 1                                                          ; Initial explode palette magnitude.
  pal_explode_mag1 = 0                                                          ; Final explode palette magnitude.
  pal_explode_time = 1000                                                       ; explode palette duration in milliseconds.
  pal_explode_radius = 0                                                        ; explode palette radius. 0 = legacy behavior.
  shk_explode_slot = 1                                                          ; Shake slot for explode. 0 = disabled.
  shk_explode_mag0 = 1                                                          ; Initial explode shake magnitude.
  shk_explode_mag1 = 0                                                          ; Final explode shake magnitude.
  shk_explode_time = 1000                                                       ; explode shake duration in milliseconds.
  shk_explode_radius = 0                                                        ; explode shake radius. 0 uses shk_explode_mute legacy attenuation.
  shk_explode_mute = 0.02                                                       ; Legacy shake attenuation used when shk_explode_radius = 0.
  shk_explode_x = 0.2                                                           ; X-axis shake strength.
  shk_explode_y = 0.2                                                           ; Y-axis shake strength.
  shk_explode_z = 1.0                                                           ; Z-axis shake strength.
end

; Inline Physical FX support the normal, goingdown and explode event families.
; Their snd_*, pal_* and shk_* suffixes use the same semantics as the existing effect system.
; Vanilla compatibility: physical_vehicle with offset_xyz remains readable for legacy data only.
; Do not mix physical_vehicle/offset_* with inline physical keys in the same block.

; Kamikaze exception: when a model = kamikaze Weapon detonates with a positive
; trigger_radius, the carrier's destroyed Ground Decals are checked immediately.
; Any contact between that XYZ sphere and eligible terrain, including tangency,
; creates the decal at the nearest terrain point. No contact = no decal, including
; the later wreck impact. size controls decal dimensions, not the contact radius.
; Absent/zero/invalid trigger_radius retains the ordinary Vehicle decal behavior.
; Existing terrain eligibility, full-footprint coverage and decal limits apply.
; Vehicle Ground Decals use the same terrain-conforming renderer as Weapon/MGUN
; decals. For Tank and Car, if death begins while the vehicle is airborne,
; no Vehicle Ground Decal is created for that death, including the later crash/death2 path.

ground_decal_id = 1                                                             ; ID of the reusable new_decal profile. Vehicles spawn on grounded destruction; Weapons spawn on real world impact. -1, absent or unknown ID = no decal.
ground_decal_size = 80_120                                                      ; Manual diameter range in world units, 0..12000. Absent, zero or invalid disables the decal.

; Unit event voices inside new_vehicle: point directly to the final pack directory.
speech_voicepack = Data/Sounds/Speech/Voicepacks/resistance-tank-medium         ; Direct pack path under Data. Missing or 0 uses vanilla voices.
; The engine recognizes these fixed WAV stems: unit_ready, unit_idle, order_ack_friendly, order_ack_enemy, unit_control_entered, enemy_sector_entered, unit_recovered, enemy_unit_spotted, enemy_host_found, request_support, unit_retreating, unit_lost, enemy_unit_engaged, enemy_unit_destroyed, enemy_host_destroyed, powerstation_captured.
; Numbered variants such as unit_ready_01.wav and unit_ready_02.wav are selected randomly without an immediate repeat.
; Missing event files use the existing vanilla voice handling. The vanilla vo_type field remains supported; speech_voicepack is the only custom voice path.
; Mimic uses the disguised vehicle prototype’s pack. WAV files may be mono or stereo, 8 or 16 bit PCM; voice filters are not applied.
; Restart after changing scripts or audio. Only the 16 engine events listed above are supported.

max_active_at_once = 15                                                         ; Maximum active count for this specific unit type, excluding instances already placed by level definitions. The campaign may raise this limit through GEM unlocks. Undefined (0) = no limit, as in the original game. The classic GEM popup shows a MAX row under the vehicle name only when the limit is defined (not in network games).
add_max_active_at_once = 3                                                      ; GEM upgrade value used inside modify_vehicle to increase and persist max_active_at_once.

production_cost = 150                                                           ; Displayed Genesis price for this vehicle. Overrides the vanilla energy-derived price (energy x 2 / 100) without changing hit points. The Genesis list is sorted by this final price. 0 or absent = vanilla behavior.
vehicle_description = Heavy assault unit                                        ; Optional vehicle description shown in the Database. If absent, the Description row is not shown.
purchase_cost = 1000                                                            ; Plasma cost to unlock the vehicle in the Workshop. If absent, the vehicle is not offered. Zero allows a free unlock. Purchases and the equipped Host Station are stored in the player profile and carry over to later levels.
type_icon = K                                                                   ; Vehicle icon (a .FON glyph key). A Unicode symbol is also accepted, e.g. ∆ or U+2206, linked in the .FON to the icon coordinates. Any value other than I lists the vehicle in the Database. Prefer U+XXXX in scripts: a pasted symbol can be corrupted by the editor's text encoding, and an unreadable icon falls back to the default A icon. The replacement character U+FFFD is rejected.

; Buffs are reusable top-level profiles. A Vehicle links to one with buff_id;
; the Buff definition itself is declared separately with new_buff [number].
; new_buff may appear in any supported script file under Data/Scripts; Buffs.cfg
; is only the recommended organizational file. Do not place the new_buff block
; inside new_vehicle.

buff_id = 1                                                                     ; ID of the new_buff profile linked to this Vehicle. -1, absent or an unknown ID = no Buff.

new_buff 1                                          ; Starts reusable Buff profile ID 1. Multiple Vehicles may reference the same ID through buff_id.
name = armored                                                                  ; Internal Buff name. This identifier does not change gameplay by itself; it labels the reusable Buff profile.
icon = Interface/StatusIcons/deflect.png                                        ; Data-relative Status Icon selected directly by this Vehicle's Buff. Empty/invalid = no Buff icon.
glow_intensity = 0.20                                                           ; Full-model Buff glow intensity, range 0..1, while at least one Buff property remains active. 0 or absent = no glow.
glow_tint = 100_180_255_255                                                     ; RGBA tint of the Buff glow. Visual only: does not modify materials or gameplay values.
glow_pulse_seconds = 1.25                                                       ; Duration in seconds of one complete Buff-glow pulse. 0 or absent = steady glow. Runtime maximum: 60 seconds.
invisible = 1                                                                   ; Keeps the unit invisible until it performs its first real attack. On reveal, this Buff property ends permanently.
invisible_reveal_vp = 229                                                       ; Legacy VP generated when invisible is revealed; final fallback.
invisible_reveal_base = Data/Models/Base/FX/REVEAL.BASE                         ; BASE reveal effect, relative to Data; falls back to invisible_reveal_vp.
invisible_reveal_3ds = Data/Models/3ds/FX/reveal.3ds                            ; 3DS reveal effect; takes priority over BASE and VP.
invulnerable = 1                                                                ; Makes the unit immune to damage while this Buff property remains active.
deflect_charges = 4                                                             ; Deflect charges available when the unit is created. Each normal projectile within the supported threshold consumes one charge and is physically deflected; Deflect ends at 0 charges. MGUN hits are blocked without consuming charges.
deflect_max_energy = 5000                                                       ; Maximum attack energy Deflect can stop. If a projectile or AOE exceeds this threshold, all remaining Deflect charges are destroyed and the attack passes through normally. 0 or absent = no energy limit.
deflect_end_energy_reduction = 50%                                              ; One-hit damage reduction applied when an attack exceeds deflect_max_energy. The hit still destroys all Deflect charges and passes through, but that single damage event is reduced by the configured percentage.
deflect_vp = 229                                                                ; VP effect generated when Deflect physically redirects a projectile; final fallback after 3DS and BASE.
deflect_base = Data/Models/Base/FX/DEFLECT.BASE                                 ; BASE effect generated when Deflect redirects a projectile; falls back to deflect_vp.
deflect_3ds = Data/Models/3ds/FX/deflect.3ds                                    ; 3DS effect generated when Deflect redirects a projectile; takes priority over BASE and VP.
end                                                  ; Ends the new_buff profile.

push_resistance = 0.5                                                           ; Resistance level 0-10 against weapon/event push. Also applies to Host Stations; not useful for static gun classes.

; at_death_* effects are independent death-triggered systems. They can be used
; separately or combined on the same Vehicle.

at_death_push_force = 10                                                        ; AOE push intensity 0-10 generated when the unit dies. 0 or absent = no death push.
at_death_push_radius = 1200                                                     ; 3D radius of the death AOE push. 0 or absent = radial death push disabled.
at_death_push_falloff = 1                                                       ; 1 decreases death-push strength progressively with distance from the epicenter; 0 keeps the same strength throughout the radius.

at_death_energy = 1000                                                          ; Energy removed in an area when the unit dies, including from allies. Respects shield and invulnerability. 0 or absent = disabled. Lethal hits can trigger another unit's at_death_energy and therefore create chain reactions. Single-player only.
at_death_energy_radius = 700                                                    ; 3D radius used by at_death_energy. 0 or absent = death energy removal disabled.
at_death_energy_falloff = 1                                                     ; 1 reduces energy removal linearly with distance from the epicenter; 0 keeps the same energy loss throughout the radius.


at_death_spawn_units = 1                                                        ; Enables child-unit spawning when this unit dies. 0 or absent = disabled.
at_death_spawn_vehicle = 5                                                      ; Vehicle ID generated at death.
at_death_spawn_count = 3                                                        ; Number of child units generated simultaneously at death. Minimum/default: 1. Runtime maximum: 8.
at_death_spawn_random_pos = 30                                                  ; XZ position randomization applied to child units generated at death.
at_death_spawn_instant = 1                                                      ; 1 generates child units immediately without the classic Genesis sequence.
at_death_spawn_immunity_time = 2000                                             ; Damage-immunity time in milliseconds granted to newly generated child units.

cockpit_camera_offset_xyz = 0_0_0                                               ; Cockpit camera X_Y_Z offset. Format: x_y_z.
cockpit_gun_camera_recoil   = 2.0                                               ; 0..5 multiplier for cockpit camera recoil from the gun. Does not alter physics, aiming or projectile origin.
cockpit_camera_hide_vehicle = 0                                                 ; Hides the vehicle's own silhouette in cockpit camera view, leaving an unobstructed forward view. 0 or absent = silhouette visible (vanilla behaviour); 1 = silhouette hidden. Defaults to 1 for model = ufo vehicles, which need maximum visibility. Can be inverted at runtime with the Hide Vehicle key (default C, remappable and persistent from Input Settings); the change is not written to this file and the value set here is restored on restart.

pal_airexplode_slot      = 4                                                    ; Palette-effect slot used when an airborne vehicle explodes in the air.
pal_airexplode_time      = 1000                                                 ; Air-explosion palette-effect duration in milliseconds.
pal_airexplode_mag0      = 1                                                    ; Initial air-explosion palette intensity.
pal_airexplode_mag1      = 0                                                    ; Final air-explosion palette intensity.
pal_airexplode_radius    = 5000                                                 ; Maximum palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_airexplode_slot      = 1                                                    ; Shake slot used when an airborne vehicle explodes in the air.
shk_airexplode_time      = 1000                                                 ; Air-explosion shake duration in milliseconds.
shk_airexplode_mag0      = 2                                                    ; Initial air-explosion shake intensity.
shk_airexplode_mag1      = 0                                                    ; Final air-explosion shake intensity.
shk_airexplode_radius   = 5000                                                  ; Maximum shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy shk_airexplode_mute behavior.
snd_airexplode_sample    = sounds/Smex02.wav                                    ; Sound played when an airborne vehicle explodes in the air.
snd_airexplode_volume    = 120                                                  ; Air-explosion sound volume.
snd_airexplode_pitch = 0_500                                                    ; Air-explosion sound pitch. Single value = fixed; min_max = random pitch selected on each playback.
snd_airexplode_radius  = 5000                                                   ; Maximum air-explosion sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.

; Main vehicle visuals can be supplied independently for each lifecycle state.
; External assets extend, rather than remove, the original VP states.

base_normal = Data/Models/Base/VEHICLE.BASE                                     ; External BASE model for normal state; automatically falls back to vp_normal.
base_fire = Data/Models/Base/VEHICLE_FIRE.BASE                                  ; External BASE model for fire state; automatically falls back to vp_fire.
base_wait = Data/Models/Base/VEHICLE_WAIT.BASE                                  ; External BASE model for wait state; automatically falls back to vp_wait.
base_dead = Data/Models/Base/VEHICLE_DEAD.BASE                                  ; External BASE model for dead state; automatically falls back to vp_dead.
; If the resolved dead visual has no persistent geometry, OpenNeoUA automatically reuses the normal visual during DEATH1 so the wreck remains visible while the existing fall physics carries it to the crash.
base_megadeth = Data/Models/Base/VEHICLE_MEGADETH.BASE                          ; External BASE model for megadeth state; automatically falls back to vp_megadeth.
base_genesis = Data/Models/Base/VEHICLE_GENESIS.BASE                            ; External BASE model for genesis state; automatically falls back to vp_genesis.

3ds_normal = Data/Models/3ds/vehicle.3ds                                        ; External 3DS model for normal state; takes priority over base_normal and vp_normal.
3ds_fire = Data/Models/3ds/vehicle_fire.3ds                                     ; External 3DS model for fire state; takes priority over base_fire and vp_fire.
3ds_wait = Data/Models/3ds/vehicle_wait.3ds                                     ; External 3DS model for wait state; takes priority over base_wait and vp_wait.
3ds_dead = Data/Models/3ds/vehicle_dead.3ds                                     ; External 3DS model for dead state; takes priority over base_dead and vp_dead.
3ds_megadeth = Data/Models/3ds/vehicle_megadeth.3ds                             ; External 3DS model for megadeth state; takes priority over base_megadeth and vp_megadeth.
3ds_genesis = Data/Models/3ds/vehicle_genesis.3ds                               ; External 3DS model for genesis state; takes priority over base_genesis and vp_genesis.

scale_xyz = 1.0_1.0_3.0                                                         ; X_Y_Z visual scale of the active main VP/BASE/3DS model. Default: 1.0. Format: x_y_z.

weapon_use_vehicle_fire = 1                                                     ; Vehicle only: 1 makes the Vehicle temporarily use its own fire-state visual (VP, BASE or 3DS) whenever it fires, and whenever one of its attached Unit Guns fires. 0, absent or invalid keeps vanilla behavior. It is a Vehicle parameter only: the former Weapon-side key has been removed, with no fallback.

disable_genesis = 1                                                             ; Vehicle only: 1 removes everything Genesis-related (the plasma) from this Vehicle. On creation it appears instantly, fully formed: no plasma, no scale-in, no genesis sound (its dest_fx create effects still play). On death the wreck falls and explodes as usual, but no death plasma is released. Works on every Vehicle class, host stations included. 0, absent or invalid keeps vanilla behavior.

spin_xyz = 0_0_10                                                               ; X_Y_Z spin intensity of the active main VP/BASE/3DS model: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.


rotation_xyz = 0_0_0                                                            ; Fixed visual rotation in degrees around the X_Y_Z axes of the active main VP/BASE/3DS model. 0 or absent = no rotation. Format: x_y_z.

tint = 40_120_255_255                                                           ; RGBA tint applied to the active main VP/BASE/3DS visual.

; These AI distance parameters replace the old paired sector/bact values with a
; clearer three-stage attack loop: acquire/attack, retreat when too close, then
; re-engage after enough separation has been recovered.

ai_attack_range        = 2100                                                   ; Replaces adist_sector and adist_bact. Distance within which the AI enters its attack maneuver.
ai_retreat_start_range = 140                                                    ; Replaces sdist_sector and sdist_bact. Below this distance, the AI starts retreating and moves away from the target.
ai_retreat_stop_range  = 550                                                    ; Distance the AI must reach while retreating before it stops retreating and resumes its attack maneuver. Must be greater than ai_retreat_start_range and not greater than ai_attack_range.
; For Weapons using an ai_fire_trigger volume, these three values control maneuvering rather than firing distance. The configured volume authorizes fire, subject to actual weapon constraints.

; Mobile Power turns a vehicle into an energy source using the same broader
; energy ecosystem as stationary power sources, while allowing its feedback to
; be defined through a reusable new_cloud profile.

power         = 130                                                             ; Amount of mobile energy generated for this vehicle and nearby allied units.
power_radius  = 2400                                                            ; Radius within which the vehicle supplies energy to itself and nearby allies.
power_falloff = 1                                                               ; 1 reduces Power effect strength with distance; 0 keeps it uniform within power_radius.
power_cloud_id = 3                                                              ; ID of the visual/audio Cloud associated with this Vehicle mobile Power. -1, absent or unknown ID = no Power Cloud.

; Vehicle/Weapon decoration FX use the same periodic/persistent concept as
; building decorations, but positions are relative to the parent object.

decoration_fx_mode = periodic                                                   ; Periodic mode: generates decorations intermittently using the parameters below.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of the active decoration visual. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.
decoration_fx_duration = 1000                                                   ; Total duration in milliseconds of each periodic decoration.
decoration_fx_interval = 500_1500                                               ; Random interval in milliseconds between decoration spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                                                       ; Random number of decorations generated per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                                                   ; XYZ position randomization around the parent Vehicle/Weapon center.
decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the parent Vehicle/Weapon center. Format: x_y_z.

decoration_fx_mode = persistent                                                 ; Persistent mode: decoration remains active while the parent Vehicle/Weapon remains active.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; BASE decoration family, relative to Data; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of the active decoration visual. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity of the decoration VP/3DS visual: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.
decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the parent Vehicle/Weapon center. Format: x_y_z.

; Damaged-state visuals are coupled to optional gameplay penalties. This means
; the damaged state can be purely cosmetic, or it can also reduce movement,
; turning and weapon cadence once the configured HP threshold is crossed.

damaged_fx_vp = 138_138_138                                                     ; VP visuals generated while the unit is damaged. Multiple VP IDs may be separated by _. Repeated damaged_fx_3ds lines can add 3DS visuals.
damaged_fx_3ds = Data/Models/3ds/FX/damaged.3ds                                 ; Optional damaged-state 3DS model. Repeat the line to add multiple 3DS candidates to the random visual selection alongside VP entries.
damaged_fx_scale = 1.0_1.7                                                      ; Uniform damaged-FX scale. Single value = fixed scale; min_max = random scale resolved independently for each generated effect. Non-positive/invalid values fall back to 1.0.
damaged_fx_threshold     = 30%                                                  ; HP threshold below which damaged FX activate. With %, uses maximum HP; without %, uses a fixed HP amount.
damaged_fx_count = 1_3                                                          ; Random number of damaged FX generated per trigger. A single value gives a fixed count. Runtime maximum: 32.
damaged_fx_interval = 500_1500                                                  ; Random interval in milliseconds between damaged-FX triggers. A single value gives a fixed interval.
damaged_fx_random_max_offset = 25%                                              ; Maximum random offset from the unit center. With %, uses unit size; without %, uses a fixed distance.
damaged_fx_trail_only    = 1                                                    ; 1 hides the main VP model while keeping its trails, particles and child effects active.
damaged_force_malus      = -50%                                                 ; Force modifier while damaged. Example: -50% reduces force by 50%.
damaged_maxrot_malus     = -50%                                                 ; maxrot modifier while damaged. Example: -50% reduces maxrot by 50%.
damaged_mgun_shot_time_malus = -50%                                             ; MGUN fire-rate modifier while damaged. Example: -50% reduces MGUN rate of fire by 50%; 0 or absent = unchanged.
damaged_shot_time_malus      = -50%                                             ; Weapon fire-rate modifier while damaged. Example: -50% reduces Weapon rate of fire by 50%; 0 or absent = unchanged.
damaged_snd_pitch        = -50%                                                 ; Pitch modifier for sounds emitted by the damaged unit. Negative values lower pitch; positive values raise it. 0 or absent = unchanged.

; MGUN is OpenNeoUA's shared hitscan machine-gun path. The same system is used
; Restored cut-content behavior: the flak uses MGUN as its primary weapon. Effective range follows game.mgun_range.
; recoil timing, tracer rendering and decal behavior.

mgun_name       =   MGUN                                                        ; Restored cut-content behavior: the flak uses MGUN as its primary weapon. Effective range follows game.mgun_range.
mgun_wireframe  = wireless/otlw38.sklt                                          ; Restored cut-content behavior: the flak uses MGUN as its primary weapon. Effective range follows game.mgun_range.
mgun_spread_xy             =   20_20                                            ; MGUN spread (format x_y): X horizontal left/right, Y vertical up/down.
cockpit_mgun_camera_recoil         =   1.5                                      ; 0-10 first-person MGUN shake intensity. One shake per shot, so it follows mgun_shot_time. Only active in the player's cockpit camera and never moves the vehicle. 0, absent or invalid = no shake.
mgun_energy                =   900                                              ; Energy removed by each MGUN shot. When present, the MGUN fires one shot every mgun_shot_time: sound, FIRE state, spread hit scan and energy hit all happen together. Absent, 0 or invalid = vanilla MGUN (continuous damage from gun_power).
mgun_angle                   =   0                                              ; MGUN angle. If absent, falls back to legacy gun_angle.
mgun_vp_dead = 99                                                               ; Legacy VP for the MGUN dead impact; final fallback.
mgun_base_dead = Data/Models/Base/FX/MGUN_DEAD.BASE                             ; BASE family for the MGUN dead impact; falls back to mgun_vp_dead.

mgun_3ds_dead = Data/Models/3ds/FX/mgun_dead.3ds                                ; 3DS model for the dead impact; takes priority over BASE and VP.
mgun_vp_megadeth = 99                                                           ; Legacy VP for the MGUN megadeth impact; final fallback.
mgun_base_megadeth = Data/Models/Base/FX/MGUN_MEGADETH.BASE                     ; BASE family for the megadeth impact; falls back to mgun_vp_megadeth.
mgun_3ds_megadeth = Data/Models/3ds/FX/mgun_megadeth.3ds                        ; 3DS model for the megadeth impact; takes priority over BASE and VP.
mgun_shot_time             =   100                                              ; Time between two MGUN shots, shared by player and AI. With mgun_energy it sets the real fire rate (sound, FIRE state, hit scan and energy hit); without mgun_energy it only paces sound, animation and cost.
mgun_shot_time_user        =   100                                              ; Player-specific time between two MGUN shots; absent or zero uses mgun_shot_time.
mgun_fire_energy_cost      =   0.05%                                            ; Energy cost per MGUN shot. 0 or absent = no cost.

; MGUN impact decals are optional and independent from other MGUN visuals.
mgun_ground_decal_id = 4                                                        ; Profile for MGUN world impacts; set its diameter with mgun_ground_decal_size.
mgun_ground_decal_size = 3_7                                                    ; Manual diameter range in world units, 0..12000. Absent, zero or invalid disables the decal.


; Multi-projectile aiming can combine independent random spread, fixed arc and
; uniform cone distribution. These values affect player fire and AI fire using
; the same weapon definition.

; Which spread parameter applies depends on the weapon class being fired:
;   Bullets, rockets, missiles, grenades, arc grenades (every non-bomb class):
;       the X and Y values of weapon_spread_xyz rotate the aim direction. The Z value is ignored.
;   Bombs and homing bombs ("model = bomb" / "model = homing_bomb"):
;       the X (left/right) and Z (forward/back) values of weapon_spread_xyz push each bomb on the
;       ground plane, relative to the carrier's heading and independent of its pitch.
;       the Y value is ignored. Bombs leave the carrier at only 20% of its speed, so the push
;       uses a fixed reference launch speed instead of the carrier's speed: it works the same
;       for a hovering or a fast carrier, and the scatter grows with the height of the drop.
;   Lasers ("model = laser", including vertical lasers) do not use any spread parameter.
; Absent, 0 or invalid (negative, non-numeric) values mean no spread on that axis.
; The Hand Brake reduction applies to all of them; ramp_up_max_weapon_spread_xy is used by
; non-bomb weapons (its X also applies to the X of a bomb's weapon_spread_xyz, its Y has no effect on bombs).

weapon_spread_xyz            =   20_20_20                                       ; Independent random spread for each projectile, in degrees (format x_y_z). X: horizontal (bombs: random left/right push on the ground plane). Y: vertical, not used by bombs and homing bombs. Z: bombs and homing bombs only, random forward/back spread on the ground plane along the carrier's heading; ignored by every other weapon class; 0, absent or invalid = none. Applied the same way for the player.
weapon_arc_xy               =   0_0                                             ; Fixed arc offset for each projectile (format x_y): X horizontal, Y vertical. Applied the same way for the player.
weapon_cone_xy               =   0                                              ; XY cone width for each generated projectile, using a uniform conical distribution.

scope_angle_min_max = -100_100                                                  ; Tank/car only: inclusive min_max of vanilla aim travel (-100 down, 0 parallel, 100 up). Absent = vanilla; outside range, red reticle and firing/lock blocked; MG unchanged.

; fire_x_* controls a virtual firing rack. It is useful for weapons that should
; visibly walk across multiple muzzle positions or alternate entire salvos.

fire_x_mode                  =   sequence                                       ; Projectile X mode: sequence = orderly X cycle; random = random X slot; salve_sequence = each whole salvo starts from one side and the next from the other; salve_mirror = splits one salvo and fires half simultaneously from each side.
fire_x_start                 =   -45                                            ; Initial X position of the firing rack used by sequence/random.
fire_x_step                  =   10                                             ; X distance between adjacent firing-rack slots.
fire_x_slots                 =   10                                             ; Total number of X slots before the rack cycle resets.

; A vehicle can expose up to four Weapon slots. Player and AI switching policies
; are independent, so the same vehicle may be manual for the player and smart
; or sequenced for AI control.

weapon_2               = 2                                                      ; Optional second Weapon slot used by the unit.
weapon_3               = 8                                                      ; Optional third Weapon slot used by the unit.
weapon_4               = 7                                                      ; Optional fourth Weapon slot used by the unit.

num_weapons = 2_4                                                               ; Projectiles generated per shot. Single value = fixed; min_max = inclusive random count in the 1-255 range. 0 preserves the vanilla single-projectile behavior.

num_weapons_snd_events = 2                                                      ; Maximum number of complete weapon sound events generated for a multi-projectile shot, preventing excessive overlap when num_weapons is greater than one.
num_weapons_2          = 0                                                      ; Projectile count used by weapon_2. Single value = fixed; min_max = random 1-255; 0 or absent = inherits num_weapons.
num_weapons_3          = 0                                                      ; Projectile count used by weapon_3. Single value = fixed; min_max = random 1-255; 0 or absent = inherits num_weapons.
num_weapons_4          = 0                                                      ; Projectile count used by weapon_4. Single value = fixed; min_max = random 1-255; 0 or absent = inherits num_weapons.

weapon_player_switch_mode = manual                                              ; Player changes Weapon manually using the mapped dedicated control.
weapon_player_switch_mode = sequence                                            ; Player Weapon automatically cycles through weapon, weapon_2, weapon_3, ...
weapon_player_switch_mode = random                                              ; Player Weapon automatically changes to a random configured slot.

weapon_ai_switch_mode = smart                                                   ; Compares base energy times the target's effective energy_* multiplier, including each shot's normal defaults. Selects the largest result; ties are random.
weapon_ai_switch_mode = sequence                                                ; AI uses its configured Weapons in sequence.
weapon_ai_switch_mode = random                                                  ; AI selects a random configured Weapon.

; Mobile unit spawners use the same core idea as building spawners, but their
; spawn positions are relative to the parent unit.

spawn_units = 1                                                                 ; Enables this unit to spawn other units.
spawn_vehicle = 5                                                               ; Vehicle ID spawned by this unit.
spawn_count = 3                                                                 ; Number of units spawned simultaneously per activation. Default: 1.
spawn_interval = 6000                                                           ; Time in milliseconds between spawn activations.
spawn_trigger_radius = 1800                                                     ; Enemy-presence radius that activates spawning.
spawn_random_pos = 200                                                          ; XZ spawn-position randomization around the parent vehicle.
spawn_offset_xyz = 0_0_0                                                        ; Spawn-position X_Y_Z offset from the parent vehicle. Format: x_y_z.
spawn_max_active = 9                                                            ; Maximum number of children generated by this unit that may be active simultaneously.
spawn_instant = 1                                                               ; 1 spawns children immediately without the classic Genesis sequence.

; Proximity Defense is an autonomous secondary Weapon system. "classic" reacts
; to nearby enemies repeatedly; "at_death" fires once on unit death.

proximity_defense_enable = 1                                                    ; Enables the vehicle's automatic Proximity Defense system.
proximity_defense_mode = classic                                                ; System mode: classic = activates around nearby enemies; at_death = activates once at unit death and fires all projectiles simultaneously.
proximity_defense_weapon = 2                                                    ; Weapon ID used by Proximity Defense.
proximity_defense_trigger_radius = 1200                                         ; Enemy-presence distance that activates classic mode.
proximity_defense_interval = 5000                                               ; Time in milliseconds between projectile bursts in classic mode.
proximity_defense_shots = 20                                                    ; Number of projectiles created per system activation.
proximity_defense_fire_mode = all_at_once                                       ; Classic firing mode: all_at_once = all projectiles together; sequential = one after another. at_death always uses all_at_once.
proximity_defense_vp_launch = 70                                                ; Legacy VP spawned when Proximity Defense projectiles launch; final fallback.
proximity_defense_base_launch = Data/Models/Base/FX/PROXIMITY_LAUNCH.BASE       ; BASE launch family, relative to Data; falls back to VP.
proximity_defense_3ds_launch = Data/Models/3ds/FX/proximity_launch.3ds          ; 3DS launch model; takes priority over BASE and VP.
proximity_defense_sequence_delay = 100                                          ; Delay in milliseconds between projectiles when fire_mode = sequential; ignored for all_at_once and at_death.
proximity_defense_vertical_angle = -90_90                                       ; Projectile vertical angle. Single value = fixed angle; min_max = random angle in range. Absent = 0.
proximity_defense_horizontal_angle = 0_360                                      ; Projectile horizontal angle. Single value = fixed angle; min_max = random angle in range. If absent, projectiles are distributed uniformly across 360 degrees.


; Universal Unit Guns generalize the original robo-mounted-gun concept so guns
; and functional modules can be attached to ordinary vehicles as well as Host
; Stations. unit_gun_protect optionally turns a mounted gun into a real damage
; layer: the module must be destroyed before the parent can be damaged directly.

unit_num_guns = 2                                                               ; Evolution of robo_num_guns: number of guns/modules that can be attached to any supported unit, including Host Stations.
unit_act_gun = 0                                                                ; Selects mounted gun index 0 for the following unit_gun_* definitions.
unit_gun_icon = Interface/StatusIcons/mobile_flak.png                           ; Optional Data-relative icon assigned to gun 0 and shown on the parent unit.
unit_gun_pos_xyz = 0.0_-200.0_55.0                                              ; Mounted gun local X_Y_Z position. Format: x_y_z.
unit_gun_dir_xyz = 0.0_0.0_1.0                                                  ; Mounted gun initial X_Y_Z direction component. Format: x_y_z.
unit_gun_type = 95                                                              ; Gun/module type ID.
unit_gun_name = FLAK                                                            ; Display/internal name assigned to this mounted gun.
unit_gun_protect = 1                                                            ; 1 makes this gun/module absorb damage and require destruction before direct damage can reach the parent vehicle.
unit_gun_no_switch = 1                                                          ; 1 prevents the player from cycling from the parent unit into this gun with F6 (or the next-unit button). 0, absent or invalid = the gun remains reachable as before. Weapons fired by a mounted gun never hit the parent unit or the other guns mounted on it.
unit_act_gun = 1                                                                ; Selects mounted gun index 1 for the following unit_gun_* definitions.
unit_gun_icon = Interface/StatusIcons/mobile_radar.png                          ; Optional Data-relative icon assigned to gun 1 and shown on the parent unit.
unit_gun_pos_xyz = 0.0_-200.0_55.0                                              ; Mounted gun local X_Y_Z position. Format: x_y_z.
unit_gun_dir_xyz = 0.0_0.0_1.0                                                  ; Mounted gun initial X_Y_Z direction component. Format: x_y_z.
unit_gun_type = 109                                                             ; Gun/module type ID.
unit_gun_name = RADAR                                                           ; Display/internal name assigned to this mounted gun.
unit_gun_protect = 1                                                            ; 1 makes this gun/module absorb damage and require destruction before direct damage can reach the parent vehicle.

briefing_size = 100                                                             ; Size of the vehicle in the briefing and debriefing model preview. Larger values make the model larger; smaller values make it smaller. Valid range 1-10000; 0, absent or any other value uses the legacy radius framing. Independent of collision_shape and coll_*; gameplay geometry, collisions and save format are unchanged.
briefing_xyz = 0_0_0                                                            ; Vehicle-only briefing/debriefing model offset in camera-axis model units: X positive right, Y positive down, Z positive away from the camera. Position remains independent of briefing_size; units refer to the default vehicle framing.
; Applied after screen placement, so the offset does not rotate with the model. Independent of Database/Workshop, cockpit, physics and collisions.
; Omitted or 0_0_0 preserves classic placement. Each axis must be finite and within -100000..100000; an invalid tuple leaves the previous valid value unchanged.

collision_shape = Data/Models/Collision/Tiger_Set1.collision                    ; Model-derived vehicle collision generated by OpenNeoUA Studio. A valid profile replaces physical spheres for movement, vehicle contacts and direct projectile/MGUN/laser hits. Empty/0/absent or invalid/missing profile = existing radius/coll_* fallback. Supported: heli, tank, car, flyer and UFO. Maximum 64 convex hulls, 128 vertices per hull; visual scale/rotation must match the bake. The same profile applies to every texture SET; asset_set records only the source SET. Rotors/FX are excluded explicitly; turrets remain in their authored pose. Source/model changes require regeneration. AoE and proximity keep separate existing logic.
collision_shape = Data/Models/Collision/Rocket_Set1.collision                   ; Weapon (new_weapon) projectile body generated by OpenNeoUA Studio. A valid profile replaces the weapon's physical spheres for direct hits against units: its hulls are swept against the target's shape, or against the target's spheres when the target has none. Terrain, building and weapon-vs-weapon impacts keep their existing logic. Empty/0/absent or invalid/missing profile = existing radius/coll_* fallback. Same limits, path rules and visual scale/rotation match as for vehicles.

; Compound collision spheres replace the limitations of a single legacy radius
; with up to 256 manually placed spheres. This is useful for long, asymmetric or
; multi-part units while keeping the collision representation simple and
; data-driven.

coll_num        =   3                                                           ; Number of manually defined coll_* spheres. Range 0-256; negative values become 0.
coll_act        =   0                                                           ; Selects collision sphere index 0. Index is clamped to 0-255.
coll_xyz      =     50_0_0                                                      ; Sphere X_Y_Z position relative to unit center. Format: x_y_z.
coll_radius     =   200                                                         ; Sphere radius.
coll_act        =   1                                                           ; Selects collision sphere index 1.
coll_xyz      =     0_-50_0                                                     ; Sphere X_Y_Z position relative to unit center. Format: x_y_z.
coll_radius     =   250                                                         ; Sphere radius.
coll_act        =   2                                                           ; Selects collision sphere index 2.
coll_xyz      =     0_50_0                                                      ; Sphere X_Y_Z position relative to unit center. Format: x_y_z.
coll_radius     =   300                                                         ; Sphere radius.

snd_genesis_pitch = auto                                                        ; Automatic Genesis sound pitch: the higher the unit's HP, the lower the generated pitch. The automatic mode is opt-in and only active with the exact value "auto"; an explicit numeric value or min_max range overrides it, while a missing pitch keeps the normal default.

--------------------Weapons:

; Weapon Chain FX use the same visual/physical concepts as vehicle Chain FX, but
; their triggers are tied to projectile impact/detonation. This makes it
; possible to build richer explosions without requiring the old dest_fx ->
; scale_fx relationship.

begin_fx                         ; Visual Chain FX replacing a dest_fx that points to scale_fx.
  trigger    = impact_world, detonate or launch                                 ; Trigger: impact_world = weapon hits terrain/buildings; detonate = weapon hits a unit or detonates; launch = weapon is fired (projectile launch point, or the start of the beam for model=laser; offset_xyz follows the projectile rotation). For model=laser, detonate also runs on world contact at the real beam endpoint.
  mode = visual                                                                 ; Uses start_size/end_size/duration and VP/BASE/3DS visuals.
  random_rotation = 0                                                           ; 1 assigns a random X/Y/Z orientation once at spawn, independently per instance; 0, omitted or invalid = normal orientation. Spawn position and launch direction are unchanged.
  count = 2_4                                                                   ; Number of effect instances generated per activation. Single value = fixed amount; min_max = random amount rolled per activation. Maximum 32; invalid = 1. With count > 1 each instance rolls its own min_max offset. Supported only with mode = visual and mode = physical; not available in SuperItem Chain FX blocks.
  offset_xyz = -20_0_20                                                         ; Effect X_Y_Z offset. Single value = fixed; min~max = random offset rolled at every activation. Format: x_y_z; each axis takes a single value or min~max.
  spin_xyz = 0_0_10                                                             ; X_Y_Z spin intensity of the Chain FX VP/BASE/3DS visuals: 0-10, decimals allowed; 0 = no spin. Applies to every model in the block. Format: x_y_z.
  start_size = 0.1                                                              ; Initial effect size. 1 = original visual size.
  mid_size   = 1                                                                ; Intermediate effect size.
  end_size   = 2                                                                ; Final effect size.
  duration   = 1000                                                             ; Effect duration in milliseconds.
  fade_inout = 500_1000                                                         ; Visual fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate.
  vp_model   = 229                                                              ; First legacy VP visual in the sequence.
  base_model = Data/Models/Base/FX/CHAIN_FX.BASE                                ; Optional BASE family for the same element. Place after vp_model to preserve VP fallback.
  3ds_model = Data/Models/3ds/FX/chain_fx.3ds                                   ; Optional 3DS model for the same element; takes priority over BASE and VP.
  tint = 80_160_255_180                                                         ; RGBA tint for all models in the visual block, regardless of position. The last value wins; omitted tint preserves original colours.
  vp_model   = 230                                                              ; Second visual in the sequence.
  vp_model   = 231                                                              ; Third visual in the sequence.
end

begin_fx                       ; Autonomous inline Physical FX generated by a Weapon event.
  trigger = impact_world, detonate or launch                                    ; Weapon trigger: world/building impact, unit/air detonation, or weapon launch.
  mode = physical                                                               ; Uses the modern inline physical fragment path rather than a Vehicle effect ID.
  random_rotation = 0                                                           ; 1 assigns a random X/Y/Z orientation once at spawn, independently per instance; 0, omitted or invalid = normal orientation. Spawn position and launch direction are unchanged.
  lifetime = 30000                                                              ; Maximum time in milliseconds that the Physical Fragment may remain in flight before it is removed. Single value = fixed lifetime; min_max = a lifetime rolled independently for each fragment. 0, absent or invalid = 30000. Ground contact still removes the fragment immediately.
  count = 1_4                                                                   ; Number of fragments created. Single value = fixed; min_max = random. Runtime maximum: 32. Each fragment independently selects its own VP entry from vp_model.
  launch_xyz = -30~30_-20_-30~30                                                ; Initial local X_Y_Z velocity (format x_y_z). Each axis takes a single value (fixed) or min~max (randomized independently for each fragment). Inline fragments spawn at the event position rather than using offset_xyz.
  vp_model = 138_193                                                            ; One or more legacy fragment VP IDs separated by _. Each spawned fragment randomly selects one entry; a single value preserves the previous behavior. VP remains the final fallback after 3DS/BASE.
  base_model = Data/Models/Base/FX/FRAGMENT.BASE                                ; Optional BASE fragment family.
  3ds_model = Data/Models/3ds/FX/fragment.3ds                                   ; Optional 3DS fragment model; highest visual priority.
  vp_impact = 140_69                                                            ; Positional impact-VP list paired with vp_model. The selected model index always uses the impact at the same index. When present, the list must contain the same number of entries; 0 disables the impact VP for that position.
  ; Entries may be repeated to weight random selection, with vp_impact repeated in the same positional order.
  tint = 255_255_255_255                                                        ; Fragment RGBA tint.
  scale = 1.0                                                                   ; Uniform fragment scale. <= 0 or invalid = 1.0.
  mass = 150                                                                    ; Fragment mass. Must be positive.
  airconst = 40.0                                                               ; Air resistance. 0 is valid.
  force = 6000                                                                  ; Additional impulse along the launch direction. 0 is valid.
  maxrot = 3.0                                                                  ; Rotation intensity. 0 disables additional rotation.
  radius = 1.0                                                                  ; Physical/collision radius. Must be positive.
  impact_energy = 200                                                           ; Energy removed once from the first unit hit by this physical fragment. Respects shield and invulnerability. 0 or absent = disabled. Single-player only.
  impact_energy_radius = 0                                                      ; Additional 3D radius for energy removal on impact. 0 = direct target only; a positive value removes the same energy from nearby units. Each fragment can remove energy only once.
  snd_normal_sample = Data/Sounds/shot7.wav                                     ; Optional fragment-spawn sound.
  snd_goingdown_sample = Data/Sounds/fall.wav                                   ; Optional goingdown sound.
  snd_explode_sample = Data/Sounds/impact.wav                                   ; Optional finish/impact sound.
  pal_goingdown_slot = 1                                                        ; Example goingdown PAL event; mag0, mag1, time and radius are also supported.
  pal_explode_slot = 1                                                          ; Example explode PAL event; mag0, mag1, time and radius are also supported.
  shk_explode_slot = 1                                                          ; Example explode SHK event; mag0, mag1, time, radius/mute and x/y/z are also supported.
end

; normal, goingdown and explode use the same snd_*, pal_* and shk_* event families documented for Vehicle Physical FX above.
; Vanilla compatibility: physical_vehicle with offset_xyz remains readable for legacy scripts, but new content should use the inline format.

; Weapon Ground Decal profiles attach a persistent or timed footprint to the
; actual terrain collision geometry. The decal is created only after a real
; projectile/world collision.

ground_decal_id = 1                                                             ; ID of the reusable new_decal profile. Vehicles spawn on grounded destruction; Weapons spawn on real world impact. -1, absent or unknown ID = no decal.
ground_decal_size = 80_120                                                      ; Manual diameter range in world units, 0..12000. Absent, zero or invalid disables the decal.
; Weapons can also use state-based external visuals. As elsewhere, 3DS has
; priority over BASE, and BASE falls back to the corresponding VP.

base_normal = Data/Models/Base/VEHICLE.BASE                                     ; External BASE model for normal state; falls back to vp_normal.
base_fire = Data/Models/Base/VEHICLE_FIRE.BASE                                  ; External BASE model for fire state; falls back to vp_fire.
base_wait = Data/Models/Base/VEHICLE_WAIT.BASE                                  ; External BASE model for wait state; falls back to vp_wait.

base_dead = Data/Models/Base/VEHICLE_DEAD.BASE                                  ; External BASE model for dead state; falls back to vp_dead.
base_megadeth = Data/Models/Base/VEHICLE_MEGADETH.BASE                          ; External BASE model for megadeth state; falls back to vp_megadeth.
base_genesis = Data/Models/Base/VEHICLE_GENESIS.BASE                            ; External BASE model for genesis state; falls back to vp_genesis.

3ds_normal = Data/Models/3ds/vehicle.3ds                                        ; External 3DS model for normal state; takes priority over base_normal and vp_normal.
3ds_fire = Data/Models/3ds/vehicle_fire.3ds                                     ; External 3DS model for fire state; takes priority over base_fire and vp_fire.
3ds_wait = Data/Models/3ds/vehicle_wait.3ds                                     ; External 3DS model for wait state; takes priority over base_wait and vp_wait.
3ds_dead = Data/Models/3ds/vehicle_dead.3ds                                     ; External 3DS model for dead state; takes priority over base_dead and vp_dead.
3ds_megadeth = Data/Models/3ds/vehicle_megadeth.3ds                             ; External 3DS model for megadeth state; takes priority over base_megadeth and vp_megadeth.
3ds_genesis = Data/Models/3ds/vehicle_genesis.3ds                               ; External 3DS model for genesis state; takes priority over base_genesis and vp_genesis.

; Damage multipliers can distinguish newer/specialized model classes while
; preserving the older flyer/tank families as fallbacks.

energy_plane     = 1.0                                                          ; Damage multiplier against model = plane. Absent = energy_flyer.
energy_glider    = 1.0                                                          ; Damage multiplier against model = glider. Absent = energy_flyer.
energy_zeppelin  = 1.0                                                          ; Damage multiplier against model = zeppelin. Absent = energy_flyer.
energy_cruiser   = 1.0                                                          ; Damage multiplier against model = cruiser. Absent = energy_flyer.
energy_ufo       = 1.0                                                          ; Damage multiplier against model = ufo. Absent = energy_flyer.
energy_car       = 1.0                                                          ; Damage multiplier against model = car. Absent = energy_tank.
energy_gun       = 1.0                                                          ; Damage multiplier against model = gun/module. Absent = generic vanilla 1.0.

add_energy_plane     = 1.0                                                      ; In modify_weapon, adds to energy_plane. If undefined, starts from energy_flyer.
add_energy_glider    = 1.0                                                      ; In modify_weapon, adds to energy_glider. If undefined, starts from energy_flyer.
add_energy_zeppelin  = 1.0                                                      ; In modify_weapon, adds to energy_zeppelin. If undefined, starts from energy_flyer.
add_energy_cruiser   = 1.0                                                      ; In modify_weapon, adds to energy_cruiser. If undefined, starts from energy_flyer.
add_energy_ufo       = 1.0                                                      ; In modify_weapon, adds to energy_ufo. If undefined, starts from energy_flyer.
add_energy_car       = 1.0                                                      ; In modify_weapon, adds to energy_car. If undefined, starts from energy_tank.
add_energy_gun       = 1.0                                                      ; In modify_weapon, adds to energy_gun. If undefined, starts from generic vanilla 1.0.

; New Weapon models are selected with the existing model field, keeping the
; system data-driven instead of introducing parallel weapon-definition formats.

model  = homing_bomb                                                            ; Homing bomb Weapon class that pursues enemy targets.

model = arc_grenade                                                             ; True ballistic arc-grenade Weapon. Flight uses start_speed, grenade_arc_angle and grenade_arc_gravity; force does not control the trajectory. The player aims mortar-style: the shell lands on the terrain point the crosshair meets, so raising or lowering the crosshair changes the firing distance. Aiming at the sky or beyond the maximum range fires at 45 degrees for maximum distance along the same heading. Dispersion is the Vehicle's weapon_spread_xyz (X left/right, Y shortens/lengthens the shot).
grenade_arc_angle = 60                                                          ; Initial vertical launch angle in degrees. With player aiming it is the preferred angle when choosing between the high and the low trajectory.
grenade_arc_gravity = 35                                                        ; Gravity applied during projectile flight, controlling how quickly it falls. 0/absent/invalid = engine-standard gravity.

model = kamikaze                                                                ; Kamikaze Weapon class: converts the firing unit into a kamikaze that approaches enemies and then detonates.
trigger_radius = 360                                                            ; Kamikaze only: XYZ fuse radius. Detonates when this sphere touches an enemy's collision surface or the active sector target's geometry, including contact during movement.
; Once attacking, a kamikaze keeps closing on the live target while preserving
; native obstacle avoidance and pending maneuvers. It ignores combat distance:
; ai_attack_range, ai_retreat_start_range and ai_retreat_stop_range. Aggression still
; controls target selection and sector attacks. No sector target = no sector fuse.
; Kamikaze blast damage also reaches building collision surfaces inside Blast_radius,
; including roofs. Each building slot is checked separately; shields, damage rules
; and Blast_falloff remain active. Other Weapon classes retain their existing blast behavior.
fire_time_scale = 0.35                                                          ; Kamikaze, player only: time-scale intensity activated while pressing FIRE.
fire_time_scale_hp_drain = 12%                                                  ; Kamikaze, player only: HP drained per second during slow motion. With %, uses maximum HP; without %, uses fixed HP. 0 or absent = disabled.

; Artillery Shell supports both a real ballistic trajectory and an emulated
; vertical-barrage mode. Manual targeting is integrated with the Tactical Map;
; automatic targeting remains available unless explicitly disabled.

model = artillery_shell                                                         ; Artillery/mortar Weapon class with barrage fire, manually controllable from the Tactical Map or managed automatically.
artillery_shell_mode = vertical_barrage                                         ; ballistic = projectile reaches the target area along a real arc; vertical_barrage = emulated barrage where rounds climb out of view and descend vertically.
artillery_shell_fall_delay = 2500                                               ; vertical_barrage only: delay before projectiles begin descending from the sky toward targets.
artillery_shell_vertical_spread_xz = 2_2                                        ; vertical_barrage only: X_Z spread while projectiles rise vertically. Format: x_z.
artillery_shell_speed = 1800                                                    ; Projectile speed used by both modes.
artillery_shell_range_minmax = 1600_8500                                        ; XZ distance from the source within which a barrage area may be selected manually or acquired automatically (format min_max).
artillery_shell_requires_radar = 1                                              ; 1 requires the target area to be visible on the faction radar; 0 permits targeting unrevealed areas.
artillery_shell_barrage_radius = 900                                            ; Radius of the bombarded area.
artillery_shell_barrage_shots = 5                                               ; Total number of projectiles available per barrage.
artillery_shell_barrage_shot_delay = 550                                        ; Time in milliseconds between successive shots in a barrage.
artillery_shell_barrage_cooldown = 14000                                        ; Mortar cooldown in milliseconds, starting after the last projectile of the barrage is launched.
artillery_shell_arc_height = 3300                                               ; ballistic: maximum projectile arc height; vertical_barrage: climb/descent altitude used above the target.
artillery_shell_airburst = 0                                                    ; 1 detonates rounds at target altitude (airburst); 0 waits for the real terrain impact point.
artillery_shell_manual_mode_only = 0                                            ; 1 leaves only player manual targeting available; 0 also permits automatic acquisition.
artillery_shell_marker_path = artillery_ring_classic.svg                        ; SVG marker path relative to Data/Interface/Map/Markers. Empty/missing/invalid falls back to artillery_ring_classic.svg.

; Laser replaces a physical projectile with a continuous beam. Damage is tick-
; based, can ramp against the same target, can chain to nearby units and can be
; rendered either with the legacy repeated visual or an external mesh.

model = laser                                                                   ; Continuous laser Weapon instead of a physical projectile.
vertical_laser_enable = 1                                                       ; 1 converts model = laser to vertical-fire mode. 0/absent = normal Laser. There is no separate vertical_laser model.
vertical_laser_ai_trigger_radius = 30                                           ; Vertical mode, AI only: XZ distance from an enemy at which AI activates vertical fire. Does not change beam range or thickness.
laser_energy_tick_time = 150                                                    ; Damage-tick interval in milliseconds when the Laser is used by AI.
laser_energy_tick_time_user = 150                                               ; Damage-tick interval in milliseconds when the Laser is used by the player.
laser_energy_increment_rate = 500                                               ; Amount by which Laser damage increases on each successive tick against the same target.
laser_spacing = 20                                                              ; Spacing between normal-state visual instances used to build the legacy VP/BASE/3DS beam. Lower values produce a denser beam.
; model=laser: pal_normal_* and shk_normal_* stay active until the beam stops. Their *_normal_time values are ignored; launch and hit effects retain their existing timing.
; model=laser: begin_fx impact_world runs on world contact, detonate on unit or world contact. Both use the real hit point and the laser's existing impact-FX cadence.
; model=laser: AI beams cannot damage or debuff allied units or remove their Deflect Buff. Contact visuals remain; player-controlled beams can still damage allies.
laser_max_energy = 50000                                                        ; Maximum damage the Laser may reach through progressive increase.
laser_chain_allow = 1                                                           ; Enables the Laser to propagate from one hit unit to nearby units.
laser_chain_max_jumps = 6                                                       ; Maximum number of additional unit-to-unit jumps after the first target.
laser_chain_radius = 1200                                                       ; Radius around the last hit unit used to search for the next chain target.
laser_chain_energy_mult = 0.8                                                   ; Damage multiplier applied at each chain jump. 1.0 = no loss; 0.8 = each jump retains 80% of the previous damage.
laser_beam_count = 5                                                            ; Number of direct Laser beams the source may generate. 0 or 1 keeps a single beam.
laser_mesh_enable = 0                                                           ; 1 enables mesh-based Laser rendering and disables the legacy beam assembled from the normal visual.
laser_mesh_path = Data/Models/3ds/laser.3ds                                     ; External 3DS mesh path used for the Laser beam.
laser_mesh_tint = 255_255_255_255                                               ; RGBA tint of the mesh Laser beam.
laser_mesh_size_xy = 5_5                                                        ; X_Y width of the mesh Laser beam. Format: x_y.
laser_mesh_glow_rate = 1.0                                                      ; Additive glow intensity, 0..10. Invalid disables only glow.
laser_mesh_pulse_rate = 0.0                                                     ; Light-pulse amplitude, 0..10. 0 or invalid disables only pulse.
laser_mesh_pulse_speed = 0.0                                                    ; Pulse speed in cycles per second, 0..10. 0 or invalid disables only pulse.
laser_mesh_noise_rate = 0.0                                                     ; Deterministic lateral beam distortion, 0..10. 0 or invalid leaves the segment straight.
laser_mesh_impact_fade_length = 150                                             ; Fade length near real contact with units, terrain or buildings. 0/invalid = no fade. Does not modify hits, damage or collision.
life_time = 4000_5000                                                           ; Weapon lifetime. Single value = fixed; min_max = a random lifetime resolved independently for each physical projectile. For model = laser it also controls maximum beam duration/length.
life_time_nt = 2200_3000                                                        ; Lifetime used when the projectile is fired without a unit target (free fire, or a multi_target missile slot with no target). Replaces life_time. Single value = fixed; min_max = a random lifetime resolved independently for each projectile. 0 or absent = life_time is used.
snd_launch_sample = sounds/Laser.WAV                                            ; Laser-specific behavior: non-looping launch sound played when FIRE begins/is held.
snd_launch_volume = 100                                                         ; Launch sound volume.
snd_launch_pitch = 900_1100                                                     ; Launch sound pitch. Single value = fixed; min_max = random pitch selected on each playback.
snd_launch_at_muzzle = 1                                                        ; Plays the launch sound from a fixed position at the shooter (like the MGUN) instead of from the moving projectile, avoiding Doppler/pan drift on fast bullets. Physical projectiles only, not lasers; launch shake/palette FX are not played. 0/absent = vanilla behavior.
snd_normal_sample = sounds/Laser.WAV                                            ; Laser-specific behavior: continuous looping sound used while the Laser is firing.
snd_normal_volume = 100                                                         ; Normal/loop sound volume.
snd_normal_pitch = 900_1100                                                     ; Normal/loop sound pitch. Single value = fixed; min_max = random pitch selected on each playback.
snd_hit_sample = sounds/LaserHit.WAV                                            ; Laser-specific behavior: serialized one-shot hit sound while the Laser contacts a surface. Continuous contact repeats it without overlapping instances.
snd_hit_volume = 100                                                            ; Hit sound volume.
snd_hit_pitch = 900_1100                                                        ; Hit sound pitch. Single value = fixed; min_max = random pitch selected on each playback.

multi_target      =   10                                                        ; Maximum simultaneous targets/projectiles managed by missile and homing_bomb only. Effective limit = min(multi_target, projectile count of the active slot).
guide_time = 3000                                                               ; missile and homing_bomb only: duration in milliseconds during which each projectile tracks its target. On expiry, it permanently continues at its current velocity without further steering or reacquisition. 0, absent or invalid preserves existing behavior; life_time remains independent.
drive_time = 7000                                                               ; Engine thrust duration in milliseconds (all projectile types except arc grenades). When it expires the projectile stops accelerating and falls like a bomb, under stronger gravity. It does not affect tracking, which is controlled by guide_time. If guide_time has already expired the projectile keeps flying straight and does not fall. Default 7000, so it only matters when lower than life_time.
ai_fire_trigger_box_below_xyz = 200_1200_400                                    ; AI only: finite downward box for bomb, homing_bomb and vertical laser. Format: total_width_vertical_depth_total_horizontal_length (X_Y_Z). The volume starts at the muzzle, follows heading and remains vertical despite pitch or roll. Width covers the complete fire_x interval plus the configured padding. Y is finite downward depth, independent of terrain height. Unit acquisition uses sphere contact at sides and end cap; sector targets use point containment. A single 0, absent or invalid values retain legacy fire control.
ai_fire_trigger_cone_below_xyz = 30_20_1200                                     ; AI only: downward elliptical cone for bomb, homing_bomb and vertical laser. Format: full_lateral_angle_full_fore_aft_angle_vertical_depth. Both full angles are in degrees, strictly between 0 and 180. The third value is finite axial depth vertically downward. The cone remains vertical and follows heading only, while its origin follows the muzzle. Reuses the complete fire_x interval and the shared finite-cone contact test.
; Downward cone acquisition, secondary-target selection and continuous vertical-laser retention share the configured volume; actual beam reach still applies. It retains existing projectile counts, fire_x modes/racks, direction patterns, spread, multi_target and firing cadence. Both downward shapes have finite depth and share the same sphere-contact and beam-reach rules.
ai_fire_trigger_box_forward_xyz = 100_80_1200                                   ; AI only: muzzle-local forward box, specified as total_width_total_height_axial_depth. Width and height are centred on the firing axis; the volume follows pitch and roll. Supported models: rocket, missile, grenade, arc_grenade and non-vertical laser.
ai_fire_trigger_cone_forward_xyz = 30_20_1200                                   ; AI only: forward elliptical cone, specified as full_horizontal_angle_full_vertical_angle_axial_depth. Both full angles are in degrees, strictly between 0 and 180; 30_20 means +/-15 horizontally and +/-10 vertically. Z is depth along the firing axis, ending at a flat cap. Supports the same models as the forward box.
ai_fire_trigger_forward_max_inclination = 25 ; Per Weapon with a forward box or cone: maximum vertical tilt toward ground targets, in degrees. From 0 to below 90; zero or absent preserves vanilla behavior. Downward volumes do not tilt.
ai_fire_trigger_min_depth = 150 ; Per Weapon with any box or cone: minimum axial distance from the muzzle. Targets inside this near dead zone do not trigger fire; Z remains the far limit. A large unit can trigger when its collision sphere touches the near limit. Zero or absent disables the dead zone.
; AI ground units (tanks and derived wheeled vehicles) aim forward volumes within the existing vanilla reticle travel, narrowed by scope_angle_min_max when authored. These limits clamp debug orientation and gate primary fire, alternate targets, missile/laser secondary targets and continuous-laser retention. A broad volume cannot authorize a vertical shot. Guns reuse their native up/down/side mechanical stops independently of acquisition distance. Only valid configured forward AI volumes enable these checks; legacy AI without a volume, manual reticle travel, hull orientation, MGUN and downward payload volumes retain their existing behavior.
; When helicopters, fixed-wing aircraft or UFOs attack a ground target (a sector, a tank, a car or a turret placed on the map), forward volumes tilt vertically toward the aim point when that point lies ahead of the nose, only when the weapon has ai_fire_trigger_forward_max_inclination, and never beyond that angle, so shots still leave roughly forward and an aircraft passing over its target does not fire straight down. Without it, the aircraft volume stays on the hull axes. The hull is not rotated and horizontal acquisition is not widened; the configured width and depth still apply. Weapons without a volume keep the vanilla check. New Debug and continuous-laser retention use the same elevation. Airborne targets and Host Station turrets are not tilted toward. With the parameter present, tanks and cars also cannot tilt that weapon's volume beyond that angle, on top of their native elevation limits. Downward volumes are unchanged.
; The four AI trigger parameters are alternatives: configure one positive volume per Weapon. Multiple positive volumes or an incompatible model produce a warning and retain legacy fire control. A single 0 disables that volume. Missing, negative, non-finite, incomplete or invalid values do not enable it. When changing shape in modify_weapon, clear the previous volume explicitly.
; During an attack, the current unit or sector-point target has priority. If it cannot trigger fire, the nearest valid enemy unit within the volume is considered. Unit overlap uses its broad collision radius rather than the exact mesh; sector points use radius 0. The target centre must be in front of the muzzle for forward volumes, or below it for downward volumes.
; All shapes reuse the full fire_x spawn interval, including vanilla, sequence, random, salve_sequence, salve_mirror and advanced fire_x_start/step/slots racks. Boxes expand across this interval; cones are swept across it. Acquisition does not advance slots, consume random values or change fire_x mode semantics.
; Fixed/ranged num_weapons and weapon_2/3/4 retain their existing source-slot rules: acquisition uses the selected Weapon, and launch uses that slot's projectile count. Direction patterns (weapon_arc_xy and weapon_cone_xy), weapon_spread_xyz, multi_target, shot_time, shot_time_user, salve_delay, energy costs and recoil are unchanged. The volume authorizes a firing event; other salvo projectiles and additional targets retain their existing weapon rules and may fall outside it. Vertical laser retains its existing in-zone secondary-target filter.
; Forward volumes respect scope_angle_min_max and Arc Grenade reachability; Arc Grenade launch also validates each actual muzzle origin. Configured volume depth determines acquisition distance independently of ai_attack_range, ai_retreat_start_range and ai_retreat_stop_range. Those parameters continue to control approach, retreat and reengagement; the volume can authorize fire during these maneuvers while a valid combat state and in-volume target remain. Actual laser reach and normal projectile flight remain unchanged. Acquisition does not guarantee a hit after authored spread/patterns.
; Applies to AI attacks, including guns firing normal Weapons. Manual fire, MGUN, kamikaze and artillery_shell are unchanged. In New Debug, F9 draws all compatible configured slots in orange: bright for the selected Weapon and dim for other slots. Trigger volumes have no text or dimension labels. Edges are clipped against the camera near plane and viewport so their visible portions remain drawn.

delay_time            =   8000                                                  ; Delayed detonation against units: projectile attaches to the target and explodes when the timer expires.
delay_time_debuff_id  =   12                                                    ; Debuff profile ID applied as soon as the projectile begins its delay_time on the struck target.

push          =   4                                                             ; Target push intensity 0-10. Standalone GUNs remain excluded; when an attached GUN is hit, push is transferred once to its valid parent and uses the parent's push_resistance.

recoil = 0.5                                                                    ; Primary Weapon recoil, range 0-10. Compatible vehicles keep their existing recoil behavior; on gun/flak model = gun, only the firing gun model slides smoothly backwards along its current barrel axis, without recoil tilt or physical displacement of the gun or parent. 0 or absent disables the effect.

weapon_energy_cost     = 0.5%                                                   ; Per-Weapon energy cost charged once per successful firing event, regardless of projectile count. 0% disables the legacy drain; absent/invalid preserves vanilla per-projectile drain.

armor_penetration_targets = 2                                                   ; Number of units the Weapon may penetrate before stopping.
armor_penetration_icon = Data/Interface/StatusIcons/armor_penetration.png       ; Optional Data-relative icon shown next to the Weapon damage while armor_penetration_targets is active.

; Spiral and Chaos are alternative projectile-motion modifiers. If both are
; configured and valid, Chaos takes priority.

spiral_speed = 2.5                                                              ; Projectile spiral turns per second. Range 0-10, decimals allowed; 0 = disabled.
spiral_radius = 30                                                              ; Radius of the projectile spiral around its central trajectory.

chaos_factor = 2.5                                                              ; Chaotic-motion strength: increases the frequency of smooth random direction changes. Range 0-10, decimals allowed; 0 = disabled. Chaos takes priority when both Chaos and Spiral are valid.
chaos_radius = 30                                                               ; Maximum random-deviation radius around the central projectile trajectory. Runtime range 0-1000.

; Progressive fire rate accelerates a continuously firing Weapon from its
; normal shot interval toward a configured minimum. Releasing FIRE or breaking
; the sequence resets the ramp.

ramp_up_time = 4000                                                             ; Time in milliseconds to reduce shot interval progressively from normal shot_time/shot_time_user to ramp_up_max_shot_time. 0/absent/invalid = disabled.
ramp_up_max_shot_time = 150                                                     ; Minimum shot interval reached at the end of ramp_up_time. Ramp progress resets when FIRE is released or the sequence is interrupted.
ramp_up_max_weapon_spread_xy = 1_1                                              ; Final random spread of this Weapon at the end of ramp_up_time (format x_y, horizontal_vertical). Decreases the X and Y of the Vehicle's weapon_spread_xyz without increasing an already lower value. Requires active ramp-up; 0/absent/invalid = disabled for that axis.

; Optional overheat behavior starts only after the Weapon has reached and then
; maintained ramp_up_max_shot_time for the configured delay.

ramp_up_overheat_hp_drain = 4%                                                  ; Percentage of overheat damage applied after the Weapon reaches and maintains ramp_up_max_shot_time.
ramp_up_overheat_time = 5000                                                    ; Time in milliseconds spent at ramp_up_max_shot_time before overheat damage begins.
ramp_up_overheat_icon = Interface/StatusIcons/overheat.png                      ; Data-relative icon shown while the unit is overheating.

; Weapon Blast uses one shared radius for units, buildings and sector structures.

Blast_radius = 400                                                              ; Shared 3D radius for units, buildings and sector structures. Missing or 0 disables the blast. Range: 0..12000.
Blast_energy = 4000                                                             ; Energy removed from all three target categories. Adds to normal energy on the direct target. Range: 0..100000000. The damage shown in the interface (DMG row, briefing, Database) is always the higher of energy and Blast_energy; Blast_energy counts only when Blast_radius is active and the weapon is not a laser.
Blast_Push = 10                                                                 ; Radial push intensity 0..10. Keeps the existing target filters and push_resistance; direct-hit push keeps precedence on the primary target, and GUN actors remain excluded.
Blast_falloff = 1                                                               ; 1 reduces blast energy and push with distance; 0 keeps them uniform inside the radius.
; Debuff_id applies at explosion to every living unit inside the radius, including allies and with Blast_energy = 0. Deflect blocks it; when mind control cannot apply, the other Debuff effects still can. Host Station and child rules also apply.

; Physical Weapon mesh tracers are an additional visual layer. They follow the
; real projectile trajectory and are rendered alongside the main VP/BASE/3DS
; projectile visual. They do not change trajectory, speed, collision or damage.

mesh_tracer_enable = 1                                                          ; 1 enables a configurable 3DS mesh tracer for physical Weapons.
mesh_tracer_path    = Data/Models/3ds/mgun_tracer_cross.3ds                     ; External 3DS mesh used by the Weapon tracer.
mesh_tracer_tint        = 255_80_80_180                                         ; General R_G_B_A tracer tint. Alpha 0 disables the effect.
mesh_tracer_head_tint   = 255_80_80_180                                         ; R_G_B_A tint of the tracer head. Absent = mesh_tracer_tint.
mesh_tracer_tail_tint   = 255_80_80_180                                         ; R_G_B_A tint of the tracer tail. Absent = mesh_tracer_tint.
mesh_tracer_size_xyz    = 4_4_100                                               ; Tracer size (format x_y_z): X base width (range 0..100), Y size (range 0..100; invalid inherits X), Z maximum visible length along the Weapon's real trajectory (range 0..6000). A 0/invalid X or Z disables the tracer.
mesh_tracer_pos_xyz     = 0_0_0                                                 ; Local X_Y_Z position relative to Weapon launch point. Clamped to -6000..6000. Format: x_y_z.
mesh_tracer_head_size   = 4                                                     ; Uniform X/Y head size. Range 0..100; 0 creates a point; absent/invalid uses size_x/size_y. Z length is controlled only by size_z to keep the tracer continuous.
mesh_tracer_tail_size   = 4                                                     ; Uniform X/Y tail size. Range 0..100; 0 closes the tail; absent/invalid uses size_x/size_y. Z length is controlled only by size_z.
mesh_tracer_glow_rate   = 0                                                     ; Glow intensity, range 0..10. Changes brightness only.
mesh_tracer_noise_rate  = 0                                                     ; Stable random trail distortion/noise, range 0..10. 0 = disabled.
mesh_tracer_pulse_rate  = 0                                                     ; Width-pulsation intensity, range 0..10. 0 = disabled.
mesh_tracer_pulse_speed = 0                                                     ; Pulsation speed in cycles per second, range 0..10. 0 = disabled; requires mesh_tracer_pulse_rate > 0.

tint = 40_120_255_255                                                           ; RGBA tint applied to the main VP/BASE/3DS visual.

spin_xyz = 0_0_10                                                               ; X_Y_Z spin intensity of the main VP/BASE/3DS visual: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.

scale_xyz = 1.0_1.0_3.0                                                         ; X_Y_Z scale of the active main VP/BASE/3DS visual. Default: 1.0. Format: x_y_z.

rotation_xyz = 0_0_0                                                            ; Fixed X_Y_Z visual rotation in degrees. 0 or absent = no rotation. Format: x_y_z.

; VP trail controls affect only embedded VP trails, particles and children; they
; do not tint or transform an external 3DS model. This separation is useful when
; the projectile body and its legacy particle system need different treatment.

vp_trail_scale_xyz = 1.0_1.0_1.0                                                ; X_Y_Z scale of VP trails, particles and embedded children only. Format: x_y_z.
vp_trail_spin_xyz = 0_0_10                                                      ; X_Y_Z spin intensity of VP trails, particles and embedded children only: 0-10. Format: x_y_z.
vp_trail_tint = 255_255_255_255                                                 ; RGBA tint applied only to VP trails, particles and embedded children; does not modify a 3DS model.

; Weapon decorations use the same reusable periodic/persistent visual subsystem
; documented above. Their offsets are relative to the parent Weapon.

decoration_fx_mode = periodic                                                   ; Periodic decoration mode.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; Data-relative BASE family; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.
decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of active decoration. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.
decoration_fx_duration = 1000                                                   ; Total periodic-decoration duration in milliseconds.
decoration_fx_interval = 500_1500                                               ; Random interval in milliseconds between spawns. A single value gives a fixed interval.
decoration_fx_count = 2_7                                                       ; Random decoration count per spawn. A single value gives a fixed count.
decoration_fx_random_pos = 90                                                   ; XYZ position randomization around the parent Vehicle/Weapon.
decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the parent Vehicle/Weapon center. Format: x_y_z.

decoration_fx_mode = persistent                                                 ; Persistent decoration remains active while the parent Vehicle/Weapon remains active.
decoration_fx_vp = 99                                                           ; Legacy VP decoration visual; final fallback.
decoration_fx_base = Data/Models/Base/FX/DECORATION.BASE                        ; Data-relative BASE family; falls back to decoration_fx_vp.
decoration_fx_3ds = Data/Models/3ds/FX/decoration.3ds                           ; 3DS decoration model; takes priority over BASE and VP.

decoration_fx_scale_xyz = 1.0_1.0_1.0                                           ; X_Y_Z scale of the active decoration. Format: x_y_z.
decoration_fx_spin_xyz = 0_0_0                                                  ; X_Y_Z spin intensity: 0-10, decimals allowed; 0 = no spin. Format: x_y_z.
decoration_fx_tint = 255_95_70_200                                              ; RGBA tint applied to the main decoration visual.
decoration_fx_fade_inout = 500_500                                              ; Main VP/3DS decoration fade-in and fade-out in milliseconds (format in_out). 0 or absent = immediate appearance/disappearance.
decoration_fx_vp_trail_tint = 255_255_255_255                                   ; RGBA tint of VP decoration particles/trails. Alpha 0 = invisible.
decoration_fx_vp_trail_scale_xyz = 1.0_1.0_1.0                                  ; X_Y scale of VP decoration particles/trails, plus a Z multiplier for particle/trail duration and therefore apparent trail length (format x_y_z).
decoration_fx_vp_trail_fade_inout = 500_500                                     ; Time in milliseconds (format in_out) for VP decoration particles/trails to fade in to their configured opacity (in) and to fade out to invisible (out). 0 or absent = immediate.
decoration_fx_offset_xyz = 0_0_-40                                              ; X_Y_Z offset from the parent Vehicle/Weapon center. Format: x_y_z.

; Chain Weapon propagation continues a hit from one enemy unit to another
; nearby target. Damage, search radius and delay are independently configurable.

chain_allow = 1                                                                 ; Enables Chain Weapon propagation after a projectile hits a unit.
chain_max_jumps = 4                                                             ; Maximum number of additional jumps/bounces after the first impact.
chain_radius = 1400                                                             ; Search radius for the next enemy target after each impact.
chain_energy_mult = 0.75                                                        ; Damage retained at each jump. 1.0 = no loss; 0.75 = each jump deals 75% of the previous jump's damage.
chain_jump_delay = 120                                                          ; Delay in milliseconds between an impact and the next chain jump. 0 = immediate propagation.

; Player-only launch shake is separate from world-space SHK effects. It can be
; used to give the player stronger weapon feedback without shaking nearby AI or
; other observers.

shk_launch_player_slot = 4                                                      ; Shake slot generated when this Weapon launches, for the player only.
shk_launch_player_time = 500                                                    ; Player-only launch-shake duration in milliseconds.
shk_launch_player_mag0 = 1.5                                                    ; Initial player-only launch-shake intensity.
shk_launch_player_mag1 = 0.5                                                    ; Final player-only launch-shake intensity.

; Debuffs are reusable top-level profiles. A Weapon links to one with debuff_id;
; SuperItems can reference the same profile family through their own debuff_id.
; The Debuff definition itself is declared separately with new_debuff [number].
; new_debuff may appear in any supported script file under Data/Scripts;
; Debuffs.cfg is only the recommended organizational file. Do not place the
; new_debuff block inside new_weapon. Host Stations remain protected from mind
; control and stun even when general Host Station Debuff application is enabled.

debuff_id = 1                                                                   ; ID of the new_debuff profile applied by this Weapon. -1, absent or an unknown ID = no Debuff.

new_debuff 1                                       ; Starts reusable Debuff profile ID 1. Multiple Weapons and SuperItems may reference the same ID through debuff_id.
allow_on_host_station = 0                                                       ; Allows the debuff to affect Host Stations. Mind control and stun are still ignored on Host Stations.
allow_on_children = 0                                                           ; Automatically propagates the active Debuff to child units generated directly by the affected unit. 0 or absent = disabled.
icon = Interface/StatusIcons/electrified.png                                    ; Data-relative icon shown while the unit is debuffed. Empty/invalid = no icon.
name = electrified                                                              ; Internal name of the debuff applied by this Weapon.
mindcontrol = 1                                                                 ; Converts the affected unit to the source faction. Does not apply to Host Stations; an inapplicable mind-control effect does not cancel the other Debuff effects.
stun = 1                                                                        ; Enables unit stun during the debuff. Does not apply to Host Stations.
stun_motion_level = 50%                                                         ; Strength of altered movement during stun: 0% = disabled, 100% = maximum.
stun_unit_fire = 1                                                              ; 1 = AI and player fire continuously while stunned; 0 = they cannot fire while stunned.
energy = 2%                                                                     ; Energy removed at each tick. With %, uses a percentage of target maximum HP; without %, uses a fixed amount.
tick_time = 2000                                                                ; Time in milliseconds between damage ticks.
duration = 12000                                                                ; Total debuff duration in milliseconds.
force_malus = -50%                                                              ; Force modifier during debuff. Example: -50% reduces force by 50%.
maxrot_malus = -50%                                                             ; maxrot modifier during debuff.
shield_malus = -50%                                                             ; Shield modifier during debuff.
mgun_shot_time_malus = -40%                                                     ; Modifier to the affected unit's MGUN fire rate.
shot_time_malus = -40%                                                          ; Modifier to the affected unit's primary Weapon fire rate.
snd_pitch_malus = -50%                                                          ; Pitch modifier for sounds emitted by the affected unit. Negative lowers pitch, positive raises it. 0 or absent = unchanged.
vp = 123_123_123_123_123_123_123_123                                            ; VP visuals generated by the debuff. Multiple VP IDs may be separated with _. If 3ds is configured, the 3DS visual is generated alongside the VPs.
3ds = Data/Models/3ds/electrified.3ds                                           ; Optional external 3DS visual generated alongside the debuff VPs, relative to Data. If missing/unloadable, configured VP visuals remain active.
tint = 0_255_0_255                                                              ; RGBA tint applied to debuff VP and 3DS visuals.
scale = 1.0                                                                     ; Uniform scale applied to debuff VP and 3DS visuals. Visual only: no effect on debuff gameplay values.
random_max_offset = 25%                                                         ; Maximum random visual offset from unit center. With %, uses unit size; without %, uses a fixed distance.
vp_trail_tint = 0_255_0_255                                                     ; RGBA tint applied only to VP trails, particles and child effects belonging to the debuff.
target_tint = 140_255_140_150                                                   ; RGBA tint applied to the affected unit model; compatible with VP and 3DS mesh visuals.
snd_sample       = sounds/zap.wav                                               ; Debuff sound. Without tick_time, remains looped for the entire debuff duration.
snd_pitch = 0_500                                                               ; Debuff sound pitch. Single value = fixed; min_max = random pitch selected on each playback.
snd_volume       = 180                                                          ; Volume of snd_sample.
snd_radius       = 3000                                                         ; Maximum debuff-sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
pal_slot         = 4                                                            ; Palette-effect slot used by the debuff.
pal_mag0         = 5                                                            ; Initial debuff palette intensity.
pal_mag1         = 0                                                            ; Final debuff palette intensity.
pal_time         = 1500                                                         ; Debuff palette-effect duration in milliseconds.
pal_radius       = 3000                                                         ; Maximum debuff palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_slot         = 1                                                            ; Shake slot used by the debuff.
shk_mag0         = 2                                                            ; Initial debuff-shake intensity.
shk_mag1         = 0                                                            ; Final debuff-shake intensity.
shk_time         = 1500                                                         ; Debuff-shake duration in milliseconds.
shk_radius       = 3000                                                         ; Maximum debuff-shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_mute = 0.02                                                                 ; Legacy debuff-shake distance attenuation factor used only when shk_radius = 0.
end                                                  ; Ends the new_debuff profile.

; Cluster Weapons split into child Weapons either after a timer or on impact.
; Child count, direction, spread and recursive generations are all data-driven.
; Keep recursive generation/count values reasonable: combinations multiply very
; quickly and can create large numbers of active projectiles.

cluster_enable          = 1                                                     ; Enables Cluster behavior. 1 = enabled, 0 = disabled.
cluster_count           = 2_8                                                   ; Number of child Weapons generated per split. Single value = fixed count; min_max = inclusive random count. Safe range 1-64; invalid values disable clustering.
cluster_weapon_id       = 3                                                     ; Weapon ID generated as the cluster child.
cluster_trigger_time    = 1000                                                  ; > 0 = timed cluster trigger in milliseconds. 0 or absent = cluster splits on impact.
cluster_horizontal_angle = 0_360                                                ; Horizontal cluster direction. Single value = fixed angle; min_max = range. 0_360 distributes clusters uniformly.
cluster_vertical_angle = -45_45                                                 ; Vertical cluster direction. Single value = fixed angle; min_max = random angle in range.
cluster_spread_xy       = 60_60                                                 ; Random X_Y deviation applied after the base angle direction; may be combined with angle parameters. Format: x_y.
cluster_vp = 112                                                                ; Legacy VP generated when the Weapon splits; final fallback.
cluster_base = Data/Models/Base/FX/CLUSTER_SPLIT.BASE                           ; BASE family generated on split, relative to Data; falls back to cluster_vp.
cluster_3ds = Data/Models/3ds/FX/cluster_split.3ds                              ; 3DS split model; takes priority over BASE and VP.
cluster_generations      = 3                                                    ; Allows generated cluster Weapons to trigger their own clustering for the configured number of generations.
pal_cluster_slot         = 4                                                    ; Palette slot used at split. 0/absent = disabled.
pal_cluster_mag0         = 5                                                    ; Initial split palette intensity. Default: 1.
pal_cluster_mag1         = 0                                                    ; Final split palette intensity. Default: 0.
pal_cluster_time         = 1500                                                 ; Split palette duration in milliseconds. Default: 1000.
pal_cluster_radius       = 4000                                                 ; Maximum cluster palette-effect radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_cluster_slot         = 1                                                    ; Shake slot used at split. 0/absent = disabled.
shk_cluster_mag0         = 2                                                    ; Initial split-shake intensity. Default: 1.
shk_cluster_mag1         = 0                                                    ; Final split-shake intensity. Default: 0.
shk_cluster_time         = 5000                                                 ; Split-shake duration in milliseconds. Default: 1000.
shk_cluster_radius       = 4000                                                 ; Maximum cluster-shake radius. Intensity decreases linearly to 0 at the limit. 0 or absent = legacy behavior.
shk_cluster_mute = 0.02                                                         ; Legacy cluster-shake distance attenuation factor used only when shk_cluster_radius = 0.
shk_cluster_xyz = 0.2_0.2_0.2                                                   ; Random cluster-shake strength multiplier on the X_Y_Z axis. Format: x_y_z.
snd_cluster_sample      = sounds/Smex02.wav                                     ; Sound played when clustering activates.
snd_cluster_pitch = 0_500                                                       ; Cluster split sound pitch. Single value = fixed; min_max = random pitch selected on each playback.
snd_cluster_volume      = 120                                                   ; Split sound volume.
snd_cluster_radius   = 4000                                                     ; Maximum cluster-sound radius. Volume decreases linearly to 0 at the limit. 0 or absent = legacy behavior.

--------------------Palette:

; Palette slots are reusable color-effect channels. Original slots retain their
; vanilla behavior; OpenNeoUA additionally allows custom RGB slots to be defined
; in Nucleus.ini and referenced by vehicle/Weapon PAL events.

; Classic slots:

gfx.color_eff_pwr[1]  = 100                                                     ; Red
gfx.color_eff_pwr[2]  = 100                                                     ; Blue
gfx.color_eff_pwr[3]  = 100                                                     ; Green
gfx.color_eff_pwr[4]  = 100                                                     ; Inverse
gfx.color_eff_pwr[5]  = 100                                                     ; Inverse Dark
gfx.color_eff_pwr[6]  = 100                                                     ; Black & White
gfx.color_eff_pwr[7]  = 100                                                     ; Inverse Turquoise

; Custom slots:

gfx.color_eff[New_Slot_Number]  = R_G_B                                         ; Defines a custom palette slot (slots 8..16). Multiple custom slots may be declared in OpenNeoUA.ini and referenced by vehicle/Weapon PAL parameters. R_G_B components use 0-255. Example: gfx.color_eff[9] = 255_102_7 ; Orange. Existing vanilla slots remain unchanged.

--------------------General Event Conventions:

; Many sound pitch parameters accept min_max, allowing one event to choose a
; different pitch each time and reducing repetition without duplicating assets.

snd_...._pitch  = -4000_500                                                     ; Example pitch range supported by pitch parameters; useful for randomized sound variation.

; Radius parameters localize sound, palette and shake events in world space.
; Setting 0 or omitting the radius preserves the documented legacy behavior.

snd_***_radius = 4000                                                           ; Maximum radius for snd events. Volume decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior.
pal_***_radius = 4000                                                           ; Maximum radius for pal events. Intensity decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior.
shk_***_radius = 4000                                                           ; Maximum radius for shk events. Intensity decreases linearly from the source to 0 at the limit. 0 or absent = legacy behavior based on the corresponding shk_***_mute behavior.


-------------------- Level Locations (OpenNeoUA only; LDF level files):

; These optional blocks belong in an LDF, never in OpenNeoUA.ini or Nucleus.
; Without begin_location blocks, location notifications are inactive and existing level behavior is preserved.
; A level containing these blocks requires OpenNeoUA and is not compatible with the vanilla engine.

begin_location 1                          ; Unique positive ID. A level supports up to 256 locations.
   name = Dairopoli                                                             ; Display name, 1-96 characters. UTF-8 and Windows-1252 accents are supported. No semicolons/newlines.
   color = white                                                                ; Title text colour. Default white; allowed values: white, yellow, orange, red, pink, purple, blue, cyan, green, lime, gray.
   sound = Data/Sounds/Locations/City.wav                                       ; Optional entry sound. A missing/invalid sound does not prevent the title from appearing.
   fade_in_ms = 450                                                             ; Fade-in duration, 0-10000 ms; default 450. Zero means immediate appearance.
   hold_ms = 2800                                                               ; Fully visible duration, 0-60000 ms; default 2800.
   fade_out_ms = 750                                                            ; Fade-out duration, 0-10000 ms; default 750. Zero means immediate disappearance.
   point = 4800_-6000                                                           ; Polygon vertex in world-space X_Z coordinates. Repeat for each vertex.
   point = 8400_-6000
   point = 9600_-8400
   point = 4800_-8400
end                                      ; Implicitly joins the last vertex to the first.

; Use 3-256 distinct vertices forming a simple, non-zero-area polygon. Concave polygons are supported.
; Only the directly controlled unit triggers entry, at any altitude. Exiting and re-entering repeats the notice.
; Switching controlled units within the same effective location does not repeat it. The last listed area wins overlaps.
; A fresh mission starting inside an area announces it. Loading a save inside does not fabricate an entry.
; The central HUD title uses Xolonium Bold and independent opacity; ordinary game UI fonts remain unchanged.
; The colour applies only to the location name; the LOCATION label and divider lines keep their current colours.
; New saves preserve location definitions. Older saves without these blocks retain definitions from the original LDF.
; Sound paths must be game-root-relative Data/... paths, with / separators and no absolute paths, virtual prefixes or traversal.
; Invalid geometry/IDs/timing are logged and skipped by the engine. An invalid sound is ignored separately; an unknown colour falls back to white.
; Studio provides the Locations tab, red OpenNeoUA-only marker, polygon editing with the chosen map colour, text colour, Undo/Redo and animated/audio preview.

