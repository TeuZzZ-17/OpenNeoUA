gfx.drain_fx_interval = 300_600                                                 ; Random interval range in milliseconds between Drain-effect spawns. A single value gives a fixed interval.
gfx.drain_fx_count = 2_4                                                        ; Random number of Drain effects created per trigger. A single value gives a fixed count. Runtime maximum: 32.
