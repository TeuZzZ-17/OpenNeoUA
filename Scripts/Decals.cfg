; OpenNeoUA reusable Ground Decal profiles.
; The filename is only organizational: new_decal <id> is the real profile definition.
; Vehicles and weapons link a profile with decal_id = <id> (vehicles can also link their
; machine gun with mgun_decal_id = <id>). Size of a decal without a fixed size:
;   - size_explosion: percentage of the explosion diameter (weapon blast_radius, vehicle
;     at_death_energy_radius / at_death_push_radius), picked randomly inside the range.
;   - size_silhouette: same with the collision diameter, used when there is no explosion.
;   - size_min: the smallest decal these percentages may produce.
; size = min_max (world units) replaces all of this with a fixed size.

new_decal 1
    name = destroyed
    texture = Interface/GroundDecals/impact_01.png
    size_explosion = 30_40
    size_silhouette = 150_200
    size_min = 30
    stretch_x = 0.8_1.2
    stretch_z = 0.8_1.2
    tint = 255_255_255_180
    random_rotation = 1
    edge_fade = 5_10
    duration = permanent
    fade_in = 0
    fade_out = 1000
    smoke_duration = 20000_25000
    smoke_fade_in = 3000
    smoke_fade_out = 20000
    smoke_count = 30_10
    smoke_size = 35_50
    smoke_growth = 3.3
    smoke_rise_speed = 25
    smoke_puff_time = 4000_7500
    smoke_drift = 35
    smoke_spread = 35
    smoke_intensity = 120
    smoke_tint = 70_70_70_150
end

