; OpenNeoUA reusable Cloud profiles: volumes of floating 3DS meshes (radiation fallout, spores,
; snow, power auras...). The filename is only organizational: new_cloud <id> is the real
; profile definition. Links: cloud_id in a level (LDF), fallout_cloud_id in a SuperItem,
; power_cloud_id in a Mobile Power vehicle.

new_cloud 1
    name = radiations

    mesh_3ds = Data/Models/3ds/Radiation.3ds
    count = 135

    spawn_radius_x = 1950
    spawn_radius_y = 720
    spawn_radius_z = 1950

    spawn_offset_x = 0
    spawn_offset_y = 260
    spawn_offset_z = 0

    lifetime_min = 5000
    lifetime_max = 9000

    velocity_x = 8
    velocity_y = -18
    velocity_z = 5

    velocity_random_x = 40
    velocity_random_y = 22
    velocity_random_z = 40

    scale_x = 3.2
    scale_y = 3.2
    scale_z = 3.2

    spin_x = 0.20
    spin_y = 0.55
    spin_z = 0.25

    fade_in = 300
    fade_out = 700

    tint = 170_255_145_165
end

