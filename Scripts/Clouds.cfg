; OpenNeoUA reusable Cloud profiles: volumes of floating 3DS meshes (radiation fallout, spores,
; snow, power auras...). The filename is only organizational: new_cloud <id> is the real
; profile definition. Links: cloud_id in a level (LDF), fallout_cloud_id in a SuperItem,
; power_cloud_id in a Mobile Power vehicle.

new_cloud 1
    name = radiations

    mesh_3ds = Data/Models/3ds/Radiation.3ds
    count = 135

    spawn_radius_xyz = 1950|720|1950

    spawn_offset_xyz = 0|260|0

    lifetime_minmax = 5000~9000

    velocity_xyz = 8|-18|5

    velocity_random_xyz = 40|22|40

    scale_xyz = 3.2|3.2|3.2

    spin_xyz = 0.20|0.55|0.25

    fade_inout = 300|700

    tint = 170|255|145|165
end

