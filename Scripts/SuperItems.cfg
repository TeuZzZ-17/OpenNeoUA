; OpenNeoUA reusable SuperItem profiles (bombs). The filename is only organizational:
; new_superitem <id> is the real profile definition. A level links a bomb with
; superitem_id = <id> inside its begin_item block.
; Stoudson Nuclear: the original nuclear bomb, with the radiation fallout cloud (Clouds.cfg 1).

new_superitem 1
    name = stoudson_nuclear
    fallout_cloud_id = 1

    wave_vp = 283
    wave_scale_xyz = 1|30|1
    ;wave_tint = 255_0_0_255
    wave_start_speed = 0
    wave_speed_ramp_time = 10000
    wave_end_speed = 2000
    wave_push_force = 2
    wave_unit_energy = 50000
    wave_building_total_destruction = 15%

    snd_wave_sample = sounds/new/stoudson_1.wav
    snd_wave_fade_inout = 20|100
    snd_wave_volume = 800
    snd_wave_pitch = 0
    snd_wave_radius = 2000

    pal_wave_slot = 1
    pal_wave_fade_inout = 150|300
    pal_wave_time = 12000
    pal_wave_mag0 = 10
    pal_wave_mag1 = 5
    pal_wave_radius = 2000

    shk_wave_slot = 1
    shk_wave_fade_inout = 150|300
    shk_wave_time = 12000
    shk_wave_mag0 = 0.1
    shk_wave_mag1 = 0
    shk_wave_radius = 2000

    push_force = 10
    push_radius = 9000
    push_falloff = 1

    debuff_id = 2

    snd_detonate_sample = sounds/new/stoudson_2.wav
    snd_detonate_fade_inout = 20|100
    snd_detonate_volume = 800
    snd_detonate_pitch = 0
    snd_detonate_radius = 10000

    shk_detonate_slot = 1
    shk_detonate_fade_inout = 150|300
    shk_detonate_time = 6000
    shk_detonate_mag0 = 1
    shk_detonate_mag1 = 2
    shk_detonate_radius = 10000

    pal_detonate_slot = 1
    pal_detonate_fade_inout = 150|300
    pal_detonate_time = 6000
    pal_detonate_mag0 = 20
    pal_detonate_mag1 = 10
    pal_detonate_radius = 10000

    begin_fx
        trigger = detonate
        bruch_id = 1223
        offset_xyz = 0|0|0
    end
    begin_fx
        trigger = detonate
        bruch_id = 1224
        offset_xyz = 0|0|0
    end
    begin_fx
        trigger = detonate
        bruch_id = 1225
        offset_xyz = 0|0|0
    end
    begin_fx
        trigger = detonate
        bruch_id = 1226
        offset_xyz = 0|0|0
    end
    begin_fx
        trigger = detonate
        bruch_id = 1227
        offset_xyz = 0|0|0
    end
    begin_fx
        trigger = detonate
        bruch_id = 1228
        offset_xyz = 0|0|0
    end
end
