; Ground decal profiles: source ground_decal_size supplies the manual diameter.

new_decal 1
    name = destroyed
    texture = Graphics/GroundDecals/Impact.png
    stretch_xz = 0.8~1.2|0.8~1.2
    tint = 255|255|255|180
    random_rotation = 1
    edge_fade = 5~10
    duration = permanent
    fade_inout = 0|1000
    effect_3ds = Data/Models/3ds/Smoke.3ds
    effect_mode = rise
    effect_active_time = 20000~25000
    effect_retrigger_interval = 45000~85000
    effect_fade_inout = 3000|20000
    effect_count = 10~15
    effect_size = 35~45
    effect_growth = 3.3
    effect_rise_speed = 25
    effect_puff_time = 2000~6500
    effect_drift = 35
    effect_spread = 35
    effect_intensity = 120
    effect_tint = 70|70|70|150
end
