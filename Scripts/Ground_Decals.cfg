; OpenNeoUA reusable Ground Decal profiles.
; The filename is only organizational: new_decal <id> is the real profile definition.
; Vehicles and weapons link a profile with ground_decal_id = <id> (vehicles can also link their
; machine gun with mgun_ground_decal_id = <id>).
; Decal size: size_by_model_% is a percentage of the diameter of the bounding sphere of the
; visual model (3ds_normal, base_normal or vp_normal, with scale_xyz applied) of the unit that
; spawns the decal: the destroyed vehicle, the projectile that hits the ground or the vehicle
; that fires the machine gun. A unit without a visual model spawns no decal.
; Example: size_by_model_% = 150_200 gives a decal up to twice as big as the unit.
; A vehicle or weapon can replace this size for itself with ground_decal_size_by_model_% = <value>
; in its own script (vehicles: mgun_ground_decal_size_by_model_% for the machine gun decal).

new_decal 1
    name = destroyed
    texture = Interface/GroundDecals/impact_01.png
    size_by_model_% = 150_200
    stretch_xz = 0.8~1.2_0.8~1.2
    tint = 255_255_255_180
    random_rotation = 1
    edge_fade = 5_10
    duration = permanent
    fade_inout = 0_1000
    smoke_duration = 20000_25000
    smoke_fade_inout = 3000_20000
    smoke_count = 30_10
    smoke_size = 35_50
    smoke_growth = 3.3
    smoke_rise_speed = 25
    smoke_puff_time = 4000_7500
    smoke_drift = 35
    smoke_spread = 35
    smoke_intensity = 120
    smoke_tint = 70_70_70_150
end

